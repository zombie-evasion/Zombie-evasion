<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Zombie Evasion</title>

<link

  rel="stylesheet"

  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

/>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  background: #0d0f10;

  color: white;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

}

main {

  max-width: 600px;

  margin: auto;

  padding: 24px;

}

.panel {

  background: #1b1e21;

  border-radius: 24px;

  padding: 24px;

}

h1 {

  font-size: 38px;

  margin-top: 0;

}

.tagline {

  font-size: 20px;

  font-weight: 700;

}

button {

  width: 100%;

  padding: 20px;

  margin-top: 14px;

  border: 0;

  border-radius: 18px;

  font-size: 20px;

  font-weight: 800;

  color: #2878ff;

}

#game {

  display: none;

}

#timer {

  font-size: 42px;

  font-weight: 800;

  margin-bottom: 18px;

}

#map {

  width: 100%;

  height: 55vh;

  min-height: 420px;

  border-radius: 20px;

  overflow: hidden;

}

#gps {

  font-size: 17px;

  margin: 18px 0 4px;

}

#status {

  font-size: 15px;

  color: #b8c0c8;

}

.player-icon {

  background: #1677ff;

  border: 4px solid white;

  border-radius: 50%;

  width: 24px !important;

  height: 24px !important;

  box-shadow: 0 0 12px rgba(0,0,0,.6);

}

</style>

</head>

<body>

<main>

<section id="home" class="panel">

  <h1>🧟 Zombie Evasion</h1>

  <p class="tagline">

    You weren't out for a run. You were trying to survive.

  </p>

  <p>

    Your real location becomes the game world.

  </p>

  <button id="start">START RUN</button>

</section>

<section id="game" class="panel">

  <div id="timer">30:00</div>

  <div id="map"></div>

  <p id="gps">Waiting for GPS…</p>

  <p id="status">

    Stay alive.

  </p>

  <button id="end">END RUN</button>

</section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;

let playerMarker;

let accuracyCircle;

let watchID;

let seconds = 1800;

let timerID;

/* START GAME */

document.getElementById("start").onclick = function () {

  document.getElementById("home").style.display = "none";

  document.getElementById("game").style.display = "block";

  startTimer();

  startMap();

};

/* TIMER */

function startTimer() {

  updateTimer();

  timerID = setInterval(function () {

    seconds--;

    updateTimer();

    if (seconds <= 0) {

      clearInterval(timerID);

      alert("YOU SURVIVED.");

    }

  },1000);

}

function updateTimer() {

  let mins = Math.floor(seconds / 60);

  let secs = seconds % 60;

  document.getElementById("timer").textContent =

    String(mins).padStart(2,"0") +

    ":" +

    String(secs).padStart(2,"0");

}

/* MAP */

function startMap() {

  map = L.map("map", {

    zoomControl: false

  }).setView([51.5,-0.1],15);

  L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

      maxZoom: 19,

      attribution: "&copy; OpenStreetMap contributors"

    }

  ).addTo(map);

  setTimeout(function(){

    map.invalidateSize();

  },300);

  requestGPS();

}

/* GPS */

function requestGPS() {

  if (!navigator.geolocation) {

    document.getElementById("gps").textContent =

      "GPS unavailable.";

    return;

  }

  document.getElementById("gps").textContent =

    "Finding your location…";

  watchID = navigator.geolocation.watchPosition(

    gpsSuccess,

    gpsError,

    {

      enableHighAccuracy: true,

      maximumAge: 1000,

      timeout: 15000

    }

  );

}

function gpsSuccess(position) {

  const lat = position.coords.latitude;

  const lng = position.coords.longitude;

  const accuracy = position.coords.accuracy;

  document.getElementById("gps").textContent =

    "GPS working — accuracy ±" +

    Math.round(accuracy) +

    "m";

  const location = [lat,lng];

  if (!playerMarker) {

    const playerIcon = L.divIcon({

      className: "player-icon",

      iconSize: [24,24]

    });

    playerMarker =

      L.marker(location,{icon:playerIcon})

      .addTo(map);

    accuracyCircle =

      L.circle(location,{

        radius: accuracy,

        weight: 1,

        fillOpacity: 0.08

      }).addTo(map);

    map.setView(location,17);

  } else {

    playerMarker.setLatLng(location);

    accuracyCircle.setLatLng(location);

    accuracyCircle.setRadius(accuracy);

    map.panTo(location);

  }

}

function gpsError(error) {

  document.getElementById("gps").textContent =

    "GPS error: " + error.message;

}

/* END GAME */

document.getElementById("end").onclick = function () {

  if (watchID !== undefined) {

    navigator.geolocation.clearWatch(watchID);

  }

  clearInterval(timerID);

  location.reload();

};

</script>

</body>

</html>
