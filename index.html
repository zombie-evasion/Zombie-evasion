<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zombie Evasion</title><style>
body{font-family:-apple-system,sans-serif;background:#111;color:#fff;margin:0;padding:24px}
main{max-width:520px;margin:auto}.panel{background:#1d1f23;padding:24px;border-radius:22px}
button{width:100%;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:800;margin-top:14px}
#game{display:none}#timer{font-size:34px;font-weight:900}.box{background:#dfe5df;height:330px;border-radius:18px;display:grid;place-items:center;font-size:38px;margin:18px 0}
</style></head><body><main>
<section id="home" class="panel"><h1>🧟 Zombie Evasion</h1><p><b>You weren't out for a run. You were trying to survive.</b></p>
<p>This is the first hosted test. Press Start to confirm the game can run properly in Safari.</p>
<button id="start">START DEMO</button></section>
<section id="game" class="panel"><div id="timer">30:00</div><div class="box">🧟 &nbsp; 🔵 &nbsp; 🧟</div>
<p id="gps">GPS not requested yet.</p><button id="locate">📍 REQUEST GPS</button><button id="end">END DEMO</button></section>
</main><script>
let secs=1800,timer=null;
document.getElementById('start').onclick=function(){
 document.getElementById('home').style.display='none';document.getElementById('game').style.display='block';
 timer=setInterval(function(){secs--;let m=Math.floor(secs/60),s=secs%60;document.getElementById('timer').textContent=m+':'+String(s).padStart(2,'0');if(secs<=0)clearInterval(timer)},1000);
};
document.getElementById('locate').onclick=function(){
 if(!navigator.geolocation){document.getElementById('gps').textContent='GPS unavailable';return;}
 navigator.geolocation.getCurrentPosition(function(p){document.getElementById('gps').textContent='GPS working — accuracy ±'+Math.round(p.coords.accuracy)+'m';},
 function(e){document.getElementById('gps').textContent='GPS error: '+e.message;},{enableHighAccuracy:true,timeout:15000});
};
document.getElementById('end').onclick=function(){clearInterval(timer);location.reload();};
</script></body></html>
