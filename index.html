<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Evasion V5</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;background:#0b0d0e;color:white;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{max-width:600px;margin:auto;padding:18px}
.panel{background:#1b1e21;border-radius:24px;padding:20px}
h1{font-size:38px;margin:0 0 15px}
.tagline{font-size:20px;font-weight:700}

button{
 width:100%;padding:18px;margin-top:12px;border:0;
 border-radius:18px;font-size:19px;font-weight:800;color:#2878ff;
}

#game{display:none}
#timer{font-size:42px;font-weight:900;margin-bottom:10px}

#hud{
 display:grid;grid-template-columns:1fr 1fr;
 gap:8px;margin-bottom:10px;
}

.hudbox{
 background:#292d31;padding:10px;border-radius:12px;font-size:13px;
}

.hudvalue{
 display:block;font-size:19px;font-weight:900;margin-top:3px;
}

#warning{
 padding:11px;margin-bottom:10px;border-radius:12px;
 text-align:center;font-weight:900;background:#253126;
}

#map{height:54vh;min-height:410px;border-radius:20px}

#gps,#routing{
 font-size:14px;margin:10px 0;color:#ddd;
}

.player-icon{
 background:#1677ff;border:4px solid white;border-radius:50%;
 width:24px!important;height:24px!important;
 box-shadow:0 0 12px #000;
}

.zombie-icon{
 font-size:32px;line-height:32px;text-align:center;
}

#caught{
 display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);
 z-index:9999;align-items:center;justify-content:center;
 text-align:center;padding:30px;
}

#caught h2{font-size:48px;margin:0}
</style>
</head>

<body>

<div id="caught">
 <div>
  <h2>💀 CAUGHT</h2>
  <p>The infected reached you.</p>
  <button onclick="location.reload()">TRY AGAIN</button>
 </div>
</div>

<main>

<section id="home" class="panel">
 <h1>🧟 Zombie Evasion</h1>

 <p class="tagline">
 V5 — STREET PURSUIT
 </p>

 <p>
 One infected will hunt you using the real
 walking network.
 </p>

 <button id="start">START RUN</button>
</section>


<section id="game" class="panel">

 <div id="timer">30:00</div>

 <div id="hud">

  <div class="hudbox">
   INFECTED
   <span class="hudvalue">1</span>
  </div>

  <div class="hudbox">
   CLOSEST
   <span class="hudvalue" id="closest">---</span>
  </div>

  <div class="hudbox">
   DISTANCE
   <span class="hudvalue" id="distance">0.00 km</span>
  </div>

  <div class="hudbox">
   ROUTE
   <span class="hudvalue" id="routeStatus">WAITING</span>
  </div>

 </div>

 <div id="warning">🟢 Waiting for infected…</div>

 <div id="map"></div>

 <p id="gps">Acquiring GPS…</p>
 <p id="routing">Routing not started.</p>

 <button id="recenter">📍 RECENTRE</button>
 <button id="end">END RUN</button>

</section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map;
let playerMarker;
let zombieMarker;
let routeLine;

let player=null;
let zombie=null;

let route=[];
let routeIndex=0;

let watchID;
let timerID;
let movementTimer;
let rerouteTimer;

let seconds=1800;
let totalDistance=0;
let lastGoodPlayer=null;

let gameOver=false;
let routeBusy=false;


/* START */

document.getElementById("start").onclick=function(){

 document.getElementById("home").style.display="none";
 document.getElementById("game").style.display="block";

 map=L.map("map").setView([51.5,-0.1],16);

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"&copy; OpenStreetMap contributors"
  }
 ).addTo(map);

 setTimeout(()=>map.invalidateSize(),300);

 startTimer();
 startGPS();

};


/* TIMER */

function startTimer(){

 timerID=setInterval(function(){

  seconds--;

  let m=Math.floor(seconds/60);
  let s=seconds%60;

  document.getElementById("timer").textContent=
   String(m).padStart(2,"0")+":"+
   String(s).padStart(2,"0");

  if(seconds<=0){
   stopGame();
   alert("YOU SURVIVED!");
  }

 },1000);

}


/* GPS */

function startGPS(){

 watchID=navigator.geolocation.watchPosition(

  gpsSuccess,

  function(error){
   document.getElementById("gps").textContent=
    "GPS error: "+error.message;
  },

  {
   enableHighAccuracy:true,
   maximumAge:1000,
   timeout:15000
  }

 );

}


function gpsSuccess(position){

 let next={
  lat:position.coords.latitude,
  lng:position.coords.longitude
 };

 let accuracy=position.coords.accuracy;

 player=next;

 document.getElementById("gps").textContent=
  "GPS working — accuracy ±"+
  Math.round(accuracy)+"m";


 /* distance filtering */

 if(accuracy<=25){

  if(lastGoodPlayer){

   let d=distanceMeters(
    lastGoodPlayer.lat,lastGoodPlayer.lng,
    player.lat,player.lng
   );

   if(d>=5 && d<=80){
    totalDistance+=d;
    lastGoodPlayer={...player};
   }

  }else{
   lastGoodPlayer={...player};
  }

 }

 document.getElementById("distance").textContent=
  (totalDistance/1000).toFixed(2)+" km";


 if(!playerMarker){

  let icon=L.divIcon({
   className:"player-icon",
   iconSize:[24,24]
  });

  playerMarker=L.marker(
   [player.lat,player.lng],
   {icon:icon,zIndexOffset:1000}
  ).addTo(map);

  map.setView([player.lat,player.lng],17);

  spawnZombie();

 }else{

  playerMarker.setLatLng([
   player.lat,player.lng
  ]);

 }

 updateThreat();

}


/* SPAWN */

function spawnZombie(){

 let bearing=Math.random()*360;

 /*
 Spawn roughly 300–400m away.
 */

 let spawn=pointFromDistance(
  player.lat,
  player.lng,
  300+Math.random()*100,
  bearing
 );

 zombie={
  lat:spawn.lat,
  lng:spawn.lng
 };

 let icon=L.divIcon({
  html:"🧟",
  className:"zombie-icon",
  iconSize:[36,36],
  iconAnchor:[18,18]
 });

 zombieMarker=L.marker(
  [zombie.lat,zombie.lng],
  {icon:icon}
 ).addTo(map);

 document.getElementById("routing").textContent=
  "Finding walking route…";

 calculateRoute();

 /*
 Move locally every 0.5 seconds.
 */

 movementTimer=setInterval(
  moveZombie,
  500
 );

 /*
 Recalculate only every 20 seconds.
 This avoids hammering the public routing demo.
 */

 rerouteTimer=setInterval(
  calculateRoute,
  20000
 );

}


/* ROUTING */

async function calculateRoute(){

 if(!player || !zombie || routeBusy || gameOver){
  return;
 }

 routeBusy=true;

 document.getElementById("routeStatus").textContent=
  "ROUTING";

 try{

  let request={
   locations:[
    {
     lat:zombie.lat,
     lon:zombie.lng,
     type:"break"
    },
    {
     lat:player.lat,
     lon:player.lng,
     type:"break"
    }
   ],

   costing:"pedestrian",

   directions_options:{
    units:"kilometers"
   }
  };


  let url=
   "https://valhalla1.openstreetmap.de/route?json="+
   encodeURIComponent(JSON.stringify(request));


  let response=await fetch(url);

  if(!response.ok){
   throw new Error("Routing server error");
  }

  let data=await response.json();

  if(
   !data.trip ||
   !data.trip.legs ||
   !data.trip.legs[0] ||
   !data.trip.legs[0].shape
  ){
   throw new Error("No walking route found");
  }


  route=decodePolyline6(
   data.trip.legs[0].shape
  );

  routeIndex=0;


  if(routeLine){
   map.removeLayer(routeLine);
  }

  /*
  Temporary route line for testing.
  This lets us SEE whether the zombie
  is actually using streets.
  */

  routeLine=L.polyline(
   route,
   {
    weight:4,
    opacity:.65,
    dashArray:"6,8"
   }
  ).addTo(map);


  document.getElementById("routeStatus").textContent=
   "STREET";

  document.getElementById("routing").textContent=
   "Zombie locked to walking route.";

 }
 catch(error){

  console.error(error);

  document.getElementById("routeStatus").textContent=
   "ERROR";

  document.getElementById("routing").textContent=
   "Route failed — will retry.";

 }

 routeBusy=false;

}


/* MOVE ZOMBIE ALONG ROUTE */

function moveZombie(){

 if(
  gameOver ||
  !zombie ||
  route.length<2 ||
  routeIndex>=route.length
 ){
  return;
 }

 /*
 Zombie speed ≈ 1.25 metres/sec.
 Movement loop is every 0.5 sec.
 */

 let remaining=0.625;

 while(
  remaining>0 &&
  routeIndex<route.length
 ){

  let target=route[routeIndex];

  let d=distanceMeters(
   zombie.lat,zombie.lng,
   target[0],target[1]
  );

  if(d<=remaining){

   zombie.lat=target[0];
   zombie.lng=target[1];

   remaining-=d;
   routeIndex++;

  }else{

   let bearing=bearingBetween(
    zombie.lat,zombie.lng,
    target[0],target[1]
   );

   let next=pointFromDistance(
    zombie.lat,zombie.lng,
    remaining,
    bearing
   );

   zombie.lat=next.lat;
   zombie.lng=next.lng;

   remaining=0;

  }

 }

 zombieMarker.setLatLng([
  zombie.lat,zombie.lng
 ]);

 updateThreat();

}


/* THREAT */

function updateThreat(){

 if(!player || !zombie) return;

 let d=distanceMeters(
  player.lat,player.lng,
  zombie.lat,zombie.lng
 );

 document.getElementById("closest").textContent=
  Math.round(d)+" m";

 let warning=document.getElementById("warning");

 if(d>150){

  warning.textContent=
   "🟢 No immediate threat";

 }else if(d>75){

  warning.textContent=
   "🟡 INFECTED NEARBY";

 }else if(d>25){

  warning.textContent=
   "🔴 RUN — INFECTED CLOSING";

 }else{

  caught();

 }

}


/* POLYLINE6 DECODER */

function decodePolyline6(encoded){

 let coordinates=[];
 let index=0;
 let lat=0;
 let lng=0;

 while(index<encoded.length){

  let result=0;
  let shift=0;
  let byte;

  do{
   byte=encoded.charCodeAt(index++)-63;
   result|=(byte&0x1f)<<shift;
   shift+=5;
  }while(byte>=0x20);

  let deltaLat=
   (result&1)?~(result>>1):(result>>1);

  lat+=deltaLat;


  result=0;
  shift=0;

  do{
   byte=encoded.charCodeAt(index++)-63;
   result|=(byte&0x1f)<<shift;
   shift+=5;
  }while(byte>=0x20);

  let deltaLng=
   (result&1)?~(result>>1):(result>>1);

  lng+=deltaLng;

  coordinates.push([
   lat/1e6,
   lng/1e6
  ]);

 }

 return coordinates;

}


/* CAUGHT */

function caught(){

 if(gameOver) return;

 gameOver=true;
 stopGame();

 document.getElementById("caught").style.display="flex";

}


/* STOP */

function stopGame(){

 clearInterval(timerID);
 clearInterval(movementTimer);
 clearInterval(rerouteTimer);

 if(watchID!==undefined){
  navigator.geolocation.clearWatch(watchID);
 }

}


/* RECENTRE */

document.getElementById("recenter").onclick=function(){

 if(player){
  map.setView(
   [player.lat,player.lng],
   17
  );
 }

};


document.getElementById("end").onclick=function(){

 stopGame();
 location.reload();

};


/* GEO MATH */

function distanceMeters(lat1,lon1,lat2,lon2){

 const R=6371000;

 const p1=lat1*Math.PI/180;
 const p2=lat2*Math.PI/180;

 const dp=(lat2-lat1)*Math.PI/180;
 const dl=(lon2-lon1)*Math.PI/180;

 const a=
  Math.sin(dp/2)**2+
  Math.cos(p1)*Math.cos(p2)*
  Math.sin(dl/2)**2;

 return R*2*Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );

}


function bearingBetween(lat1,lon1,lat2,lon2){

 const p1=lat1*Math.PI/180;
 const p2=lat2*Math.PI/180;
 const dl=(lon2-lon1)*Math.PI/180;

 const y=
  Math.sin(dl)*Math.cos(p2);

 const x=
  Math.cos(p1)*Math.sin(p2)-
  Math.sin(p1)*Math.cos(p2)*Math.cos(dl);

 return(
  Math.atan2(y,x)*180/Math.PI+360
 )%360;

}


function pointFromDistance(lat,lng,metres,bearing){

 const R=6371000;

 const d=metres/R;
 const b=bearing*Math.PI/180;

 const p1=lat*Math.PI/180;
 const l1=lng*Math.PI/180;

 const p2=Math.asin(
  Math.sin(p1)*Math.cos(d)+
  Math.cos(p1)*Math.sin(d)*Math.cos(b)
 );

 const l2=l1+Math.atan2(
  Math.sin(b)*Math.sin(d)*Math.cos(p1),
  Math.cos(d)-Math.sin(p1)*Math.sin(p2)
 );

 return{
  lat:p2*180/Math.PI,
  lng:l2*180/Math.PI
 };

}

</script>
</body>
</html>
