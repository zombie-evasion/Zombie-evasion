<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Evasion V7</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d0e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:600px;margin:auto;padding:18px}
.panel{background:#1b1e21;border-radius:24px;padding:20px}
h1{font-size:38px;margin:0 0 12px}
h2{font-size:18px;color:#bbb}
button{width:100%;padding:18px;margin-top:12px;border:0;border-radius:18px;font-size:19px;font-weight:800;color:#2878ff}
#game{display:none}
#timer{font-size:42px;font-weight:900;margin-bottom:10px}
#hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.box{background:#292d31;padding:10px;border-radius:12px;font-size:13px}
.value{display:block;font-size:19px;font-weight:900;margin-top:3px}
#warning{padding:11px;margin-bottom:10px;border-radius:12px;text-align:center;font-weight:900;background:#253126}
#map{height:54vh;min-height:410px;border-radius:20px}
#gps,#debug{font-size:14px;color:#ddd}
.player-icon{background:#1677ff;border:4px solid white;border-radius:50%;width:24px!important;height:24px!important;box-shadow:0 0 12px #000}
.zombie-icon{font-size:32px;line-height:32px;text-align:center}
</style>
</head>

<body>
<main>

<section id="home" class="panel">
<h1>🧟 Zombie Evasion</h1>
<h2>V7 — HYBRID PATHFINDER</h2>
<p>
The infected can cross open terrain but must navigate around mapped solid obstacles.
</p>
<button id="start">START RUN</button>
</section>

<section id="game" class="panel">

<div id="timer">30:00</div>

<div id="hud">
 <div class="box">INFECTED<span class="value">1</span></div>
 <div class="box">CLOSEST<span class="value" id="closest">---</span></div>
 <div class="box">NAVIGATION<span class="value" id="nav">SCANNING</span></div>
 <div class="box">DISTANCE<span class="value" id="distance">0.00 km</span></div>
</div>

<div id="warning">🟢 Acquiring position…</div>

<div id="map"></div>

<p id="gps">Waiting for GPS…</p>
<p id="debug">Terrain not loaded.</p>

<button id="recenter">📍 RECENTRE</button>
<button id="end">END RUN</button>

</section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map,playerMarker,zombieMarker,routeLine;

let player=null;
let zombie=null;

let obstacles=[];
let route=[];
let routeIndex=0;

let watchID,timerID,moveTimer,rerouteTimer;

let seconds=1800;
let totalDistance=0;
let lastGoodPlayer=null;

let routeBusy=false;
let gameOver=false;


/* ---------- START ---------- */

document.getElementById("start").onclick=()=>{

 document.getElementById("home").style.display="none";
 document.getElementById("game").style.display="block";

 map=L.map("map").setView([51.5,-0.1],16);

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"&copy; OpenStreetMap contributors"
  }
 ).addTo(map);

 setTimeout(()=>map.invalidateSize(),300);

 timerID=setInterval(tick,1000);

 watchID=navigator.geolocation.watchPosition(
  gpsSuccess,
  e=>{
   document.getElementById("gps").textContent=
   "GPS error: "+e.message;
  },
  {
   enableHighAccuracy:true,
   maximumAge:1000,
   timeout:15000
  }
 );

};


/* ---------- GPS ---------- */

function gpsSuccess(p){

 player={
  lat:p.coords.latitude,
  lng:p.coords.longitude
 };

 let accuracy=p.coords.accuracy;

 document.getElementById("gps").textContent=
 "GPS working — accuracy ±"+Math.round(accuracy)+"m";


 if(accuracy<=25){

  if(lastGoodPlayer){

   let d=distanceMeters(
    lastGoodPlayer.lat,lastGoodPlayer.lng,
    player.lat,player.lng
   );

   if(d>=5 && d<=80){
    totalDistance+=d;
    lastGoodPlayer={...player};
   }

  }else{
   lastGoodPlayer={...player};
  }

 }

 document.getElementById("distance").textContent=
 (totalDistance/1000).toFixed(2)+" km";


 if(!playerMarker){

  playerMarker=L.marker(
   [player.lat,player.lng],
   {
    icon:L.divIcon({
     className:"player-icon",
     iconSize:[24,24]
    }),
    zIndexOffset:1000
   }
  ).addTo(map);

  map.setView([player.lat,player.lng],17);

  initialiseGame();

 }else{

  playerMarker.setLatLng([
   player.lat,player.lng
  ]);

 }

 updateThreat();

}


/* ---------- INITIALISE ---------- */

async function initialiseGame(){

 await loadTerrain();

 spawnZombie();

 calculateHybridRoute();

 moveTimer=setInterval(moveZombie,500);

 /*
 Recalculate as player moves.
 */

 rerouteTimer=setInterval(
  calculateHybridRoute,
  10000
 );

}


/* ---------- TERRAIN ---------- */

async function loadTerrain(){

 document.getElementById("debug").textContent=
 "Scanning buildings, water and barriers…";

 let q=`
 [out:json][timeout:25];
 (
  way(around:700,${player.lat},${player.lng})["building"];
  way(around:700,${player.lat},${player.lng})["natural"="water"];
  way(around:700,${player.lat},${player.lng})["waterway"="riverbank"];
  way(around:700,${player.lat},${player.lng})["barrier"="wall"];
  way(around:700,${player.lat},${player.lng})["barrier"="fence"];
 );
 out geom;
 `;

 try{

  let response=await fetch(
   "https://overpass-api.de/api/interpreter",
   {
    method:"POST",
    body:"data="+encodeURIComponent(q)
   }
  );

  if(!response.ok) throw new Error();

  let data=await response.json();

  obstacles=[];

  data.elements.forEach(el=>{

   if(!el.geometry || el.geometry.length<2) return;

   let points=el.geometry.map(p=>({
    lat:p.lat,
    lng:p.lon
   }));

   obstacles.push({
    points:points,
    closed:
     el.tags &&
     (
      el.tags.building ||
      el.tags.natural==="water" ||
      el.tags.waterway==="riverbank"
     )
   });

  });

  document.getElementById("debug").textContent=
  "Terrain ready — "+obstacles.length+
  " mapped obstacles.";

 }catch(e){

  document.getElementById("debug").textContent=
  "Terrain scan failed.";

 }

}


/* ---------- SPAWN ---------- */

function spawnZombie(){

 let spawn=pointFromDistance(
  player.lat,
  player.lng,
  300+Math.random()*100,
  Math.random()*360
 );

 zombie={
  lat:spawn.lat,
  lng:spawn.lng
 };

 zombieMarker=L.marker(
  [zombie.lat,zombie.lng],
  {
   icon:L.divIcon({
    html:"🧟",
    className:"zombie-icon",
    iconSize:[36,36],
    iconAnchor:[18,18]
   })
  }
 ).addTo(map);

}


/* ---------- HYBRID PATHFINDER ---------- */

function calculateHybridRoute(){

 if(
  routeBusy ||
  !player ||
  !zombie ||
  gameOver
 ) return;

 routeBusy=true;

 document.getElementById("nav").textContent=
 "THINKING";


 /*
 Build navigation nodes.

 Start = zombie.
 End = player.

 Add offset points around obstacle vertices.
 */

 let nodes=[
  {lat:zombie.lat,lng:zombie.lng},
  {lat:player.lat,lng:player.lng}
 ];


 for(let obstacle of obstacles){

  for(let p of obstacle.points){

   /*
   Only use obstacle vertices reasonably
   near the chase area.
   */

   let dz=distanceMeters(
    zombie.lat,zombie.lng,
    p.lat,p.lng
   );

   let dp=distanceMeters(
    player.lat,player.lng,
    p.lat,p.lng
   );

   if(dz<500 || dp<500){

    /*
    Create small offset candidates around
    obstacle corners so zombie doesn't
    scrape directly through the polygon.
    */

    for(let bearing of [0,90,180,270]){

     let candidate=
      pointFromDistance(
       p.lat,p.lng,
       5,
       bearing
      );

     if(!pointInsideSolid(candidate)){
      nodes.push(candidate);
     }

    }

   }

  }

 }


 /*
 Limit node count for mobile performance.
 */

 if(nodes.length>220){
  nodes=nodes.slice(0,220);
 }


 /*
 Visibility graph.
 */

 let graph=
  Array.from(
   {length:nodes.length},
   ()=>[]
  );


 for(let i=0;i<nodes.length;i++){

  for(let j=i+1;j<nodes.length;j++){

   let d=distanceMeters(
    nodes[i].lat,nodes[i].lng,
    nodes[j].lat,nodes[j].lng
   );

   /*
   Don't create unnecessarily huge edges
   except direct player/zombie connection.
   */

   if(
    d>250 &&
    !(i===0 && j===1)
   ) continue;


   if(
    !lineHitsObstacle(
     nodes[i],
     nodes[j]
    )
   ){

    graph[i].push({
     node:j,
     cost:d
    });

    graph[j].push({
     node:i,
     cost:d
    });

   }

  }

 }


 let result=dijkstra(
  graph,
  0,
  1
 );


 if(result){

  route=result.map(i=>[
   nodes[i].lat,
   nodes[i].lng
  ]);

  routeIndex=1;

  let direct=
   route.length===2;

  document.getElementById("nav").textContent=
   direct ? "FIELD" : "HYBRID";

  document.getElementById("debug").textContent=
   direct
   ? "Clear terrain — direct pursuit."
   : "Obstacle avoided — mixed terrain route.";


  if(routeLine){
   map.removeLayer(routeLine);
  }


  routeLine=L.polyline(
   route,
   {
    color:direct ? "#ff9f0a" : "#bf5af2",
    weight:5,
    opacity:.8,
    dashArray:"6,8"
   }
  ).addTo(map);

 }else{

  document.getElementById("nav").textContent=
  "BLOCKED";

  document.getElementById("debug").textContent=
  "No safe hybrid route found.";

 }

 routeBusy=false;

}


/* ---------- DIJKSTRA ---------- */

function dijkstra(graph,start,end){

 let dist=
  Array(graph.length).fill(Infinity);

 let previous=
  Array(graph.length).fill(null);

 let visited=
  Array(graph.length).fill(false);

 dist[start]=0;


 for(let count=0;count<graph.length;count++){

  let u=-1;
  let best=Infinity;

  for(let i=0;i<graph.length;i++){

   if(!visited[i] && dist[i]<best){
    best=dist[i];
    u=i;
   }

  }

  if(u===-1) break;
  if(u===end) break;

  visited[u]=true;


  for(let edge of graph[u]){

   let alt=
    dist[u]+edge.cost;

   if(alt<dist[edge.node]){

    dist[edge.node]=alt;
    previous[edge.node]=u;

   }

  }

 }


 if(!isFinite(dist[end])){
  return null;
 }


 let path=[];
 let u=end;

 while(u!==null){

  path.unshift(u);

  if(u===start) break;

  u=previous[u];

 }

 return path;

}


/* ---------- COLLISION ---------- */

function lineHitsObstacle(a,b){

 for(let obstacle of obstacles){

  let pts=obstacle.points;

  for(let i=0;i<pts.length-1;i++){

   if(
    segmentsIntersect(
     a,b,
     pts[i],pts[i+1]
    )
   ){
    return true;
   }

  }

  if(
   obstacle.closed &&
   pts.length>2
  ){

   if(
    segmentsIntersect(
     a,b,
     pts[pts.length-1],
     pts[0]
    )
   ){
    return true;
   }

  }

 }

 return false;

}


function pointInsideSolid(point){

 for(let obstacle of obstacles){

  if(
   obstacle.closed &&
   pointInPolygon(
    point,
    obstacle.points
   )
  ){
   return true;
  }

 }

 return false;

}


function pointInPolygon(p,poly){

 let inside=false;

 for(
  let i=0,j=poly.length-1;
  i<poly.length;
  j=i++
 ){

  let xi=poly[i].lng;
  let yi=poly[i].lat;

  let xj=poly[j].lng;
  let yj=poly[j].lat;

  let intersect=
   ((yi>p.lat)!==(yj>p.lat)) &&
   (
    p.lng <
    (xj-xi)*
    (p.lat-yi)/
    (yj-yi)+xi
   );

  if(intersect){
   inside=!inside;
  }

 }

 return inside;

}


function segmentsIntersect(a,b,c,d){

 function orientation(p,q,r){

  return(
   (q.lng-p.lng)*
   (r.lat-p.lat)-
   (q.lat-p.lat)*
   (r.lng-p.lng)
  );

 }

 let o1=orientation(a,b,c);
 let o2=orientation(a,b,d);
 let o3=orientation(c,d,a);
 let o4=orientation(c,d,b);

 return(
  ((o1>0&&o2<0)||(o1<0&&o2>0)) &&
  ((o3>0&&o4<0)||(o3<0&&o4>0))
 );

}


/* ---------- MOVEMENT ---------- */

function moveZombie(){

 if(
  gameOver ||
  !zombie ||
  route.length<2 ||
  routeIndex>=route.length
 ) return;

 /*
 1.25m/s.
 */

 let remaining=.625;


 while(
  remaining>0 &&
  routeIndex<route.length
 ){

  let target=route[routeIndex];

  let d=distanceMeters(
   zombie.lat,zombie.lng,
   target[0],target[1]
  );


  if(d<=remaining){

   zombie.lat=target[0];
   zombie.lng=target[1];

   remaining-=d;
   routeIndex++;

  }else{

   let bearing=
    bearingBetween(
     zombie.lat,zombie.lng,
     target[0],target[1]
    );

   let next=
    pointFromDistance(
     zombie.lat,zombie.lng,
     remaining,
     bearing
    );

   zombie.lat=next.lat;
   zombie.lng=next.lng;

   remaining=0;

  }

 }


 zombieMarker.setLatLng([
  zombie.lat,
  zombie.lng
 ]);

 updateThreat();

}


/* ---------- THREAT ---------- */

function updateThreat(){

 if(!player || !zombie) return;

 let d=distanceMeters(
  player.lat,player.lng,
  zombie.lat,zombie.lng
 );

 document.getElementById("closest").textContent=
 Math.round(d)+" m";


 let warning=
  document.getElementById("warning");


 if(d>150){

  warning.textContent=
   "🟢 No immediate threat";

 }else if(d>75){

  warning.textContent=
   "🟡 INFECTED NEARBY";

 }else if(d>25){

  warning.textContent=
   "🔴 RUN — INFECTED CLOSING";

 }else{

  gameOver=true;
  stopGame();

  alert("💀 CAUGHT");

 }

}


/* ---------- TIMER ---------- */

function tick(){

 seconds--;

 let m=Math.floor(seconds/60);
 let s=seconds%60;

 document.getElementById("timer").textContent=
 String(m).padStart(2,"0")+
 ":"+
 String(s).padStart(2,"0");

 if(seconds<=0){

  gameOver=true;
  stopGame();

  alert("YOU SURVIVED!");

 }

}


/* ---------- GEO ---------- */

function distanceMeters(a,b,c,d){

 const R=6371000;

 const p1=a*Math.PI/180;
 const p2=c*Math.PI/180;

 const dp=(c-a)*Math.PI/180;
 const dl=(d-b)*Math.PI/180;

 const x=
  Math.sin(dp/2)**2+
  Math.cos(p1)*
  Math.cos(p2)*
  Math.sin(dl/2)**2;

 return R*2*Math.atan2(
  Math.sqrt(x),
  Math.sqrt(1-x)
 );

}


function bearingBetween(a,b,c,d){

 const p1=a*Math.PI/180;
 const p2=c*Math.PI/180;

 const dl=(d-b)*Math.PI/180;

 const y=
  Math.sin(dl)*
  Math.cos(p2);

 const x=
  Math.cos(p1)*
  Math.sin(p2)-
  Math.sin(p1)*
  Math.cos(p2)*
  Math.cos(dl);

 return(
  Math.atan2(y,x)*
  180/Math.PI+
  360
 )%360;

}


function pointFromDistance(lat,lng,m,bearing){

 const R=6371000;

 const d=m/R;
 const br=bearing*Math.PI/180;

 const p1=lat*Math.PI/180;
 const l1=lng*Math.PI/180;

 const p2=Math.asin(
  Math.sin(p1)*Math.cos(d)+
  Math.cos(p1)*Math.sin(d)*Math.cos(br)
 );

 const l2=l1+Math.atan2(
  Math.sin(br)*
  Math.sin(d)*
  Math.cos(p1),

  Math.cos(d)-
  Math.sin(p1)*
  Math.sin(p2)
 );

 return{
  lat:p2*180/Math.PI,
  lng:l2*180/Math.PI
 };

}


/* ---------- CONTROLS ---------- */

document.getElementById("recenter").onclick=()=>{

 if(player){
  map.setView(
   [player.lat,player.lng],
   17
  );
 }

};


document.getElementById("end").onclick=()=>{

 stopGame();
 location.reload();

};


function stopGame(){

 clearInterval(timerID);
 clearInterval(moveTimer);
 clearInterval(rerouteTimer);

 if(watchID!==undefined){
  navigator.geolocation.clearWatch(watchID);
 }

}

</script>
</body>
</html>
