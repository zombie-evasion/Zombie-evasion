<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Zombie Evasion V8.2</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b0d0e;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

main{

}

 display:grid;

}

 display:block;

}

}

 border-radius:20px
}

}

 width:24px!important;

}

<body>

<main>

<section id="home" class="panel">

<h1>🧟 Zombie Evasion</h1>

<h2>V8.2 — TERRAIN PREDATOR</h2>

<p>
Stable pursuit with cached terrain intelligence
and automatic terrain-server fallback.
</p>

<button id="start">START RUN</button>

</section>


<section id="game" class="panel">

<div id="timer">30:00</div>

<div id="hud">

<div class="box">
INFECTED
<span class="value">1</span>
</div>

<div class="box">
CLOSEST
<span class="value" id="closest">---</span>
</div>

<div class="box">
PREDATOR MODE
<span class="value" id="nav">GPS</span>
</div>

<div class="box">
DISTANCE
<span class="value" id="distance">0.00 km</span>
</div>

</div>

<div id="warning">🟢 Acquiring position…</div>

<div id="map"></div>

<p id="gps">Waiting for GPS…</p>

<p id="terrainStatus">Terrain intelligence waiting…</p>

<p id="debug">Game engine ready.</p>

<button id="recenter">📍 RECENTRE</button>

<button id="end">END RUN</button>

</section>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==================================================
   CORE STATE
================================================== */

let map;
let playerMarker;
let zombieMarker;
let routeLine;

let player=null;
let zombie=null;

let route=[];
let routeIndex=0;

let hardObstacles=[];
let openAreas=[];

let terrainReady=false;
let terrainFailed=false;

let watchID;
let timerID;
let moveTimer;
let rethinkTimer;

let seconds=1800;

let totalDistance=0;
let lastGoodPlayer=null;

let gameOver=false;
let routeBusy=false;
let gameInitialised=false;


/* ==================================================
   START
================================================== */

document.getElementById("start").onclick=function(){

 document.getElementById("home").style.display="none";
 document.getElementById("game").style.display="block";

 updateTimer();

 timerID=setInterval(
  tick,
  1000
 );

 map=L.map(
  "map",
  {zoomControl:true}
 ).setView(
  [51.5,-0.1],
  16
 );

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"&copy; OpenStreetMap contributors"
  }
 ).addTo(map);

 setTimeout(function(){
  map.invalidateSize();
 },200);

 if(!navigator.geolocation){

  document.getElementById("gps").textContent=
  "GPS unavailable.";

  return;
 }

 watchID=
 navigator.geolocation.watchPosition(
  gpsSuccess,
  gpsError,
  {
   enableHighAccuracy:true,
   maximumAge:1000,
   timeout:15000
  }
 );

};


/* ==================================================
   GPS
================================================== */

function gpsSuccess(position){

 const lat=position.coords.latitude;
 const lng=position.coords.longitude;
 const accuracy=position.coords.accuracy;

 player={lat,lng};

 document.getElementById("gps").textContent=
 "GPS working — accuracy ±"+
 Math.round(accuracy)+"m";

 if(accuracy<=25){

  if(!lastGoodPlayer){

   lastGoodPlayer={lat,lng};

  }else{

   let moved=
   distanceMeters(
    lastGoodPlayer.lat,
    lastGoodPlayer.lng,
    lat,
    lng
   );

   if(
    moved>=5 &&
    moved<=80
   ){

    totalDistance+=moved;
    lastGoodPlayer={lat,lng};

   }

  }

 }

 document.getElementById("distance").textContent=
 (totalDistance/1000).toFixed(2)+" km";

 if(!playerMarker){

  playerMarker=
  L.marker(
   [lat,lng],
   {
    icon:L.divIcon({
     className:"player-icon",
     iconSize:[24,24]
    }),
    zIndexOffset:1000
   }
  ).addTo(map);

  map.setView(
   [lat,lng],
   17
  );

  if(!gameInitialised){

   gameInitialised=true;

   setTimeout(
    initialiseGame,
    100
   );

  }

 }else{

  playerMarker.setLatLng(
   [lat,lng]
  );

 }

 updateThreat();

}


function gpsError(error){

 document.getElementById("gps").textContent=
 "GPS error: "+error.message;

}


/* ==================================================
   INITIALISE
================================================== */

async function initialiseGame(){

 document.getElementById("nav").textContent=
 "SPAWNING";

 document.getElementById("debug").textContent=
 "Finding a safe infected spawn…";

 let spawned=
 await spawnZombieOnNetwork();

 if(!spawned){

  document.getElementById("nav").textContent=
  "RETRYING";

  document.getElementById("debug").textContent=
  "Spawn service unavailable — retrying.";

  setTimeout(
   initialiseGame,
   4000
  );

  return;
 }

 moveTimer=setInterval(
  moveZombie,
  500
 );

 rethinkTimer=setInterval(
  planPredatorRoute,
  8000
 );

 /*
 Terrain begins only after the
 basic chase is already functioning.
 */

 setTimeout(
  loadTerrain,
  300
 );

}


/* ==================================================
   SAFE NETWORK SPAWN
================================================== */

async function spawnZombieOnNetwork(){

 if(!player){
  return false;
 }

 for(
  let attempt=0;
  attempt<4;
  attempt++
 ){

  let candidate=
  pointFromDistance(
   player.lat,
   player.lng,
   300+
   Math.random()*120,
   Math.random()*360
  );

  try{

   let walkingRoute=
   await getWalkingRoute(
    candidate,
    player
   );

   if(
    !walkingRoute ||
    walkingRoute.length<2
   ){
    continue;
   }

   let spawnPoint={
    lat:walkingRoute[0][0],
    lng:walkingRoute[0][1]
   };

   let d=
   distanceMeters(
    spawnPoint.lat,
    spawnPoint.lng,
    player.lat,
    player.lng
   );

   if(d<220){
    continue;
   }

   zombie={
    lat:spawnPoint.lat,
    lng:spawnPoint.lng
   };

   zombieMarker=
   L.marker(
    [
     zombie.lat,
     zombie.lng
    ],
    {
     icon:L.divIcon({
      html:"🧟",
      className:"zombie-icon",
      iconSize:[36,36],
      iconAnchor:[18,18]
     })
    }
   ).addTo(map);

   route=walkingRoute;

   routeIndex=
   closestRouteIndex(
    zombie,
    route
   );

   if(
    routeIndex<
    route.length-1
   ){
    routeIndex++;
   }

   drawRoute(
    route,
    "#3b82f6"
   );

   document.getElementById("nav").textContent=
   "STREET";

   document.getElementById("debug").textContent=
   "Predator spawned on walking network.";

   updateThreat();

   return true;

  }catch(error){}

 }

 return false;

}


/* ==================================================
   TERRAIN CACHE
================================================== */

function terrainCacheKey(){

 /*
 Rounded to roughly neighbourhood level.

 Nearby starts reuse the same terrain.
 */

 return(
  "zombieTerrain_v82_"+
  player.lat.toFixed(3)+"_"+
  player.lng.toFixed(3)
 );

}


function loadTerrainFromCache(){

 try{

  let raw=
  localStorage.getItem(
   terrainCacheKey()
  );

  if(!raw){
   return false;
  }

  let cached=
  JSON.parse(raw);

  /*
  Six-hour cache.
  */

  if(
   !cached.time ||
   Date.now()-cached.time>
   6*60*60*1000
  ){
   return false;
  }

  if(
   !Array.isArray(cached.elements)
  ){
   return false;
  }

  processTerrainChunks(
   cached.elements
  );

  return true;

 }catch(error){

  return false;

 }

}


/* ==================================================
   TERRAIN LOAD
================================================== */

async function loadTerrain(){

 if(!player){
  return;
 }

 document.getElementById("terrainStatus").textContent=
 "Checking terrain cache…";


 /*
 Try local cache first.
 */

 try{

  let raw=
  localStorage.getItem(
   terrainCacheKey()
  );

  if(raw){

   let cached=
   JSON.parse(raw);

   if(
    cached.time &&
    Date.now()-cached.time<
    6*60*60*1000 &&
    Array.isArray(cached.elements)
   ){

    document.getElementById("terrainStatus").textContent=
    "Loading cached terrain…";

    await processTerrainChunks(
     cached.elements
    );

    terrainReady=true;
    terrainFailed=false;

    showTerrainReady(
     "cached"
    );

    setTimeout(
     planPredatorRoute,
     100
    );

    return;

   }

  }

 }catch(error){}


 /*
 Smaller radius than V8.1.
 */

 let query=`
 [out:json][timeout:10];
 (
  way(around:420,${player.lat},${player.lng})["building"];

  way(around:420,${player.lat},${player.lng})["natural"="water"];

  way(around:420,${player.lat},${player.lng})["waterway"="riverbank"];

  way(around:420,${player.lat},${player.lng})["barrier"="wall"];

  way(around:420,${player.lat},${player.lng})["barrier"="fence"];

  way(around:420,${player.lat},${player.lng})["landuse"="meadow"];

  way(around:420,${player.lat},${player.lng})["landuse"="grass"];

  way(around:420,${player.lat},${player.lng})["landuse"="recreation_ground"];

  way(around:420,${player.lat},${player.lng})["landuse"="farmland"];

  way(around:420,${player.lat},${player.lng})["landuse"="village_green"];

  way(around:420,${player.lat},${player.lng})["leisure"="park"];
 );
 out geom;
 `;


 /*
 Try two independent public endpoints.
 */

 let servers=[

  "https://overpass-api.de/api/interpreter",

  "https://overpass.kumi.systems/api/interpreter"

 ];


 for(
  let i=0;
  i<servers.length;
  i++
 ){

  document.getElementById("terrainStatus").textContent=
  i===0
   ? "Loading terrain…"
   : "Trying backup terrain server…";


  try{

   let elements=
   await fetchTerrain(
    servers[i],
    query
   );


   /*
   Cache RAW result so future runs
   don't need another request.
   */

   try{

    localStorage.setItem(
     terrainCacheKey(),
     JSON.stringify({
      time:Date.now(),
      elements:elements
     })
    );

   }catch(error){}


   await processTerrainChunks(
    elements
   );


   terrainReady=true;
   terrainFailed=false;


   showTerrainReady(
    i===0
     ? "primary"
     : "backup"
   );


   setTimeout(
    planPredatorRoute,
    100
   );


   return;

  }catch(error){

   /*
   Try next server.
   */

  }

 }


 /*
 Both failed.
 Keep the already-working street chase.
 */

 terrainReady=false;
 terrainFailed=true;


 document.getElementById("terrainStatus").textContent=
 "Terrain unavailable — street pursuit remains active.";


 document.getElementById("nav").textContent=
 "STREET";

}


/* ==================================================
   TERRAIN FETCH
================================================== */

async function fetchTerrain(
 server,
 query
){

 const controller=
 new AbortController();


 const timeout=
 setTimeout(
  function(){
   controller.abort();
  },
  5000
 );


 try{

  let response=
  await fetch(
   server,
   {
    method:"POST",
    body:
     "data="+
     encodeURIComponent(query),
    signal:controller.signal
   }
  );


  clearTimeout(timeout);


  if(!response.ok){

   throw new Error(
    "Terrain HTTP error"
   );

  }


  let data=
  await response.json();


  return(
   data.elements || []
  );


 }catch(error){

  clearTimeout(timeout);

  throw error;

 }

}


/* ==================================================
   TERRAIN CHUNKS
================================================== */

function processTerrainChunks(elements){

 hardObstacles=[];
 openAreas=[];


 return new Promise(
  function(resolve){

   let index=0;


   function nextChunk(){

    let end=
    Math.min(
     index+25,
     elements.length
    );


    for(
     ;
     index<end;
     index++
    ){

     let el=
     elements[index];


     if(
      !el.geometry ||
      el.geometry.length<2
     ){
      continue;
     }


     let tags=
     el.tags || {};


     let points=
     el.geometry.map(
      function(p){

       return{
        lat:p.lat,
        lng:p.lon
       };

      }
     );


     let bbox=
     makeBBox(
      points
     );


     if(
      tags.building ||
      tags.natural==="water" ||
      tags.waterway==="riverbank" ||
      tags.barrier==="wall" ||
      tags.barrier==="fence"
     ){

      hardObstacles.push({
       points:points,
       bbox:bbox,
       closed:
        !!(
         tags.building ||
         tags.natural==="water" ||
         tags.waterway==="riverbank"
        )
      });


      continue;

     }


     if(
      tags.landuse==="meadow" ||
      tags.landuse==="grass" ||
      tags.landuse==="recreation_ground" ||
      tags.landuse==="farmland" ||
      tags.landuse==="village_green" ||
      tags.leisure==="park"
     ){

      if(
       points.length>=3
      ){

       openAreas.push({
        points:points,
        bbox:bbox
       });

      }

     }

    }


    if(
     index<
     elements.length
    ){

     /*
     Give Safari a repaint opportunity.
     */

     setTimeout(
      nextChunk,
      0
     );

    }else{

     resolve();

    }

   }


   nextChunk();

  }
 );

}


function showTerrainReady(source){

 document.getElementById("terrainStatus").textContent=

 "Terrain ready — "+
 hardObstacles.length+
 " obstacles / "+
 openAreas.length+
 " open zones ("+
 source+
 ").";

}


/* ==================================================
   PREDATOR AI
================================================== */

async function planPredatorRoute(){

 if(
  gameOver ||
  routeBusy ||
  !player ||
  !zombie
 ){
  return;
 }


 routeBusy=true;


 /*
 Terrain is optional.
 */

 if(
  terrainReady &&
  directOpenPursuit(
   zombie,
   player
  )
 ){

  route=[
   [
    zombie.lat,
    zombie.lng
   ],

   [
    player.lat,
    player.lng
   ]
  ];


  routeIndex=1;


  drawRoute(
   route,
   "#ff9f0a"
  );


  document.getElementById("nav").textContent=
  "FIELD";


  document.getElementById("debug").textContent=
  "Open-terrain attack line found.";


  routeBusy=false;

  return;

 }


 /*
 Otherwise use our proven route.
 */

 await streetFallback();


 routeBusy=false;

}


/* ==================================================
   FIELD TEST
================================================== */

function directOpenPursuit(a,b){

 if(
  lineHitsHardObstacle(
   a,
   b
  )
 ){
  return false;
 }


 let d=
 distanceMeters(
  a.lat,a.lng,
  b.lat,b.lng
 );


 let samples=
 Math.min(
  10,
  Math.max(
   4,
   Math.ceil(d/40)
  )
 );


 let open=0;


 for(
  let i=0;
  i<=samples;
  i++
 ){

  let t=i/samples;


  let point={
   lat:
    a.lat+
    (b.lat-a.lat)*t,

   lng:
    a.lng+
    (b.lng-a.lng)*t
  };


  if(
   pointInOpenArea(
    point
   )
  ){
   open++;
  }

 }


 return(
  open/
  (samples+1)
 )>=0.65;

}


/* ==================================================
   STREET ROUTING
================================================== */

async function streetFallback(){

 document.getElementById("nav").textContent=
 "STREET";


 try{

  let newRoute=
  await getWalkingRoute(
   zombie,
   player
  );


  if(
   !newRoute ||
   newRoute.length<2
  ){
   throw new Error(
    "No route"
   );
  }


  route=
  newRoute;


  routeIndex=
  closestRouteIndex(
   zombie,
   route
  );


  if(
   routeIndex<
   route.length-1
  ){
   routeIndex++;
  }


  drawRoute(
   route,
   "#3b82f6"
  );


  document.getElementById("nav").textContent=
  "STREET";


  document.getElementById("debug").textContent=
  "Walking-network pursuit active.";


 }catch(error){

  /*
  Keep old route.
  Never freeze or stop the chase.
  */

  document.getElementById("nav").textContent=
  "RETRY";


  document.getElementById("debug").textContent=
  "Route refresh failed — previous route retained.";

 }

}


/* ==================================================
   WALKING ROUTE REQUEST
================================================== */

async function getWalkingRoute(
 start,
 end
){

 let request={

  locations:[

   {
    lat:start.lat,
    lon:start.lng,
    type:"break"
   },

   {
    lat:end.lat,
    lon:end.lng,
    type:"break"
   }

  ],

  costing:"pedestrian"

 };


 let url=

 "https://valhalla1.openstreetmap.de/route?json="+

 encodeURIComponent(
  JSON.stringify(request)
 );


 const controller=
 new AbortController();


 const timeout=
 setTimeout(
  function(){
   controller.abort();
  },
  6000
 );


 try{

  let response=
  await fetch(
   url,
   {
    signal:
     controller.signal
   }
  );


  clearTimeout(timeout);


  if(!response.ok){

   throw new Error(
    "Routing failed"
   );

  }


  let data=
  await response.json();


  if(
   !data.trip ||
   !data.trip.legs ||
   !data.trip.legs[0] ||
   !data.trip.legs[0].shape
  ){

   throw new Error(
    "No route"
   );

  }


  return decodePolyline6(
   data.trip.legs[0].shape
  );


 }catch(error){

  clearTimeout(timeout);

  throw error;

 }

}


/* ==================================================
   ZOMBIE MOVEMENT
================================================== */

function moveZombie(){

 if(
  gameOver ||
  !zombie ||
  route.length<2 ||
  routeIndex>=route.length
 ){
  return;
 }


 let remaining=
 0.625;


 while(
  remaining>0 &&
  routeIndex<
  route.length
 ){

  let target=
  route[routeIndex];


  let d=
  distanceMeters(
   zombie.lat,
   zombie.lng,
   target[0],
   target[1]
  );


  if(
   d<=remaining
  ){

   zombie.lat=
   target[0];

   zombie.lng=
   target[1];

   remaining-=d;

   routeIndex++;

  }else{

   let bearing=
   bearingBetween(
    zombie.lat,
    zombie.lng,
    target[0],
    target[1]
   );


   let next=
   pointFromDistance(
    zombie.lat,
    zombie.lng,
    remaining,
    bearing
   );


   zombie.lat=
   next.lat;

   zombie.lng=
   next.lng;

   remaining=0;

  }

 }


 zombieMarker.setLatLng(
  [
   zombie.lat,
   zombie.lng
  ]
 );


 updateThreat();

}


/* ==================================================
   THREAT
================================================== */

function updateThreat(){

 if(
  !player ||
  !zombie
 ){
  return;
 }


 let d=
 distanceMeters(
  player.lat,
  player.lng,
  zombie.lat,
  zombie.lng
 );


 document.getElementById("closest").textContent=
 Math.round(d)+" m";


 let warning=
 document.getElementById("warning");


 if(d>150){

  warning.textContent=
  "🟢 No immediate threat";

 }else if(d>75){

  warning.textContent=
  "🟡 INFECTED NEARBY";

 }else if(d>25){

  warning.textContent=
  "🔴 RUN — INFECTED CLOSING";

 }else{

  gameOver=true;

  stopGame();

  alert(
   "💀 CAUGHT"
  );

 }

}


/* ==================================================
   TERRAIN GEOMETRY
================================================== */

function lineHitsHardObstacle(
 a,
 b
){

 let lineBox=
 makeBBox(
  [a,b]
 );


 for(
  let obstacle of hardObstacles
 ){

  if(
   !boxesOverlap(
    lineBox,
    obstacle.bbox
   )
  ){
   continue;
  }


  let points=
  obstacle.points;


  for(
   let i=0;
   i<points.length-1;
   i++
  ){

   if(
    segmentsIntersect(
     a,
     b,
     points[i],
     points[i+1]
    )
   ){
    return true;
   }

  }


  if(
   obstacle.closed &&
   points.length>2
  ){

   if(
    segmentsIntersect(
     a,
     b,
     points[
      points.length-1
     ],
     points[0]
    )
   ){
    return true;
   }

  }

 }


 return false;

}


function pointInOpenArea(point){

 for(
  let area of openAreas
 ){

  if(
   point.lat<
    area.bbox.minLat ||
   point.lat>
    area.bbox.maxLat ||
   point.lng<
    area.bbox.minLng ||
   point.lng>
    area.bbox.maxLng
  ){
   continue;
  }


  if(
   pointInPolygon(
    point,
    area.points
   )
  ){
   return true;
  }

 }


 return false;

}


/* ==================================================
   BOUNDING BOX
================================================== */

function makeBBox(points){

 let minLat=Infinity;
 let maxLat=-Infinity;

 let minLng=Infinity;
 let maxLng=-Infinity;


 for(
  let p of points
 ){

  minLat=
   Math.min(
    minLat,
    p.lat
   );

  maxLat=
   Math.max(
    maxLat,
    p.lat
   );

  minLng=
   Math.min(
    minLng,
    p.lng
   );

  maxLng=
   Math.max(
    maxLng,
    p.lng
   );

 }


 return{
  minLat,
  maxLat,
  minLng,
  maxLng
 };

}


function boxesOverlap(a,b){

 return !(
  a.maxLat<b.minLat ||
  a.minLat>b.maxLat ||
  a.maxLng<b.minLng ||
  a.minLng>b.maxLng
 );

}


/* ==================================================
   POLYGON
================================================== */

function pointInPolygon(
 p,
 poly
){

 let inside=false;


 for(
  let i=0,
      j=poly.length-1;

  i<poly.length;

  j=i++
 ){

  let xi=poly[i].lng;
  let yi=poly[i].lat;

  let xj=poly[j].lng;
  let yj=poly[j].lat;


  let intersect=

  ((yi>p.lat)!==(yj>p.lat))

  &&

  (
   p.lng<

   (xj-xi)*
   (p.lat-yi)/
   ((yj-yi)||0.0000001)
   +xi
  );


  if(intersect){
   inside=!inside;
  }

 }


 return inside;

}


/* ==================================================
   SEGMENT COLLISION
================================================== */

function segmentsIntersect(
 a,b,c,d
){

 function orientation(
  p,q,r
 ){

  return(
   (q.lng-p.lng)*
   (r.lat-p.lat)
   -
   (q.lat-p.lat)*
   (r.lng-p.lng)
  );

 }


 let o1=
 orientation(a,b,c);

 let o2=
 orientation(a,b,d);

 let o3=
 orientation(c,d,a);

 let o4=
 orientation(c,d,b);


 return(

  (
   (o1>0 && o2<0) ||
   (o1<0 && o2>0)
  )

  &&

  (
   (o3>0 && o4<0) ||
   (o3<0 && o4>0)
  )

 );

}

  }

}


/* ==================================================
   CLOSEST ROUTE POINT
================================================== */

function closestRouteIndex(
 point,
 points
){

 let bestIndex=0;
 let bestDistance=Infinity;


 for(
  let i=0;
  i<points.length;
  i++
 ){

  let d=
  distanceMeters(
   point.lat,
   point.lng,
   points[i][0],
   points[i][1]
  );


  if(
   d<
   bestDistance
  ){

   bestDistance=d;
   bestIndex=i;

  }

 }


 return bestIndex;

}


/* ==================================================
   POLYLINE DECODER
================================================== */

function decodePolyline6(encoded){

 let coordinates=[];

 let index=0;
 let lat=0;
 let lng=0;


 while(
  index<
  encoded.length
 ){

  let result=0;
  let shift=0;
  let byte;


  do{

   byte=
   encoded.charCodeAt(
    index++
   )-63;

   result|=
   (byte&31)<<shift;

   shift+=5;

  }while(
   byte>=32
  );


  lat+=
  (result&1)
   ? ~(result>>1)
   : (result>>1);


  result=0;
  shift=0;


  do{

   byte=
   encoded.charCodeAt(
    index++
   )-63;

   result|=
   (byte&31)<<shift;

   shift+=5;

  }while(
   byte>=32
  );


  lng+=
  (result&1)
   ? ~(result>>1)
   : (result>>1);


  coordinates.push(
   [
    lat/1e6,
    lng/1e6
   ]
  );

 }


 return coordinates;

}


/* ==================================================
   GEO MATH
================================================== */

function distanceMeters(
 lat1,
 lon1,
 lat2,
 lon2
){

 const R=
 6371000;


 const p1=
 lat1*Math.PI/180;

 const p2=
 lat2*Math.PI/180;


 const dp=
 (lat2-lat1)*
 Math.PI/180;

 const dl=
 (lon2-lon1)*
 Math.PI/180;


 const a=

 Math.sin(dp/2)**2

 +

 Math.cos(p1)*
 Math.cos(p2)*
 Math.sin(dl/2)**2;


 return R*2*Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );

}


function bearingBetween(
 lat1,
 lon1,
 lat2,
 lon2
){

 const p1=
 lat1*Math.PI/180;

 const p2=
 lat2*Math.PI/180;


 const dl=
 (lon2-lon1)*
 Math.PI/180;


 const y=
 Math.sin(dl)*
 Math.cos(p2);


 const x=

 Math.cos(p1)*
 Math.sin(p2)

 -

 Math.sin(p1)*
 Math.cos(p2)*
 Math.cos(dl);


 return(
  Math.atan2(y,x)*
  180/Math.PI+
  360
 )%360;

}


function pointFromDistance(
 lat,
 lng,
 metres,
 bearing
){

 const R=
 6371000;


 const d=
 metres/R;


 const b=
 bearing*
 Math.PI/180;


 const p1=
 lat*
 Math.PI/180;


 const l1=
 lng*
 Math.PI/180;


 const p2=
 Math.asin(

  Math.sin(p1)*
  Math.cos(d)

  +

  Math.cos(p1)*
  Math.sin(d)*
  Math.cos(b)

 );


 const l2=
 l1+
 Math.atan2(

  Math.sin(b)*
  Math.sin(d)*
  Math.cos(p1),

  Math.cos(d)
  -
  Math.sin(p1)*
  Math.sin(p2)

 );


 return{
  lat:
   p2*
   180/Math.PI,

  lng:
   l2*
   180/Math.PI
 };

}


/* ==================================================
   TIMER
================================================== */

function tick(){

 if(gameOver){
  return;
 }


 seconds--;


 updateTimer();


 if(seconds<=0){

  gameOver=true;

  stopGame();

  alert(
   "YOU SURVIVED!"
  );

 }

}


function updateTimer(){

 let mins=
 Math.floor(
  seconds/60
 );


 let secs=
 seconds%60;


 document.getElementById("timer").textContent=

 String(mins).padStart(
  2,
  "0"
 )

 +

 ":"

 +

 String(secs).padStart(
  2,
  "0"
 );

}

   ],
   17
  );

};


document.getElementById("end").onclick=function(){

 stopGame();

 location.reload();

};


function stopGame(){

 clearInterval(
  timerID
 );

 clearInterval(
  moveTimer
 );

 clearInterval(
  rethinkTimer
 );


 if(
  watchID!==undefined
 ){

  navigator.geolocation.clearWatch(
   watchID
  );

 }

}
