<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Zombie Evasion V6</title>

<link rel="stylesheet"

href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{box-sizing:border-box}

body{

 margin:0;background:#0b0d0e;color:#fff;

 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif

}

main{max-width:600px;margin:auto;padding:18px}

.panel{background:#1b1e21;border-radius:24px;padding:20px}

h1{font-size:38px;margin:0 0 15px}

button{

 width:100%;padding:18px;margin-top:12px;border:0;

 border-radius:18px;font-size:19px;font-weight:800;color:#2878ff

}

#game{display:none}

#timer{font-size:42px;font-weight:900;margin-bottom:10px}

#hud{

 display:grid;grid-template-columns:1fr 1fr;

 gap:8px;margin-bottom:10px

}

.box{background:#292d31;padding:10px;border-radius:12px;font-size:13px}

.value{display:block;font-size:19px;font-weight:900;margin-top:3px}

#warning{

 padding:11px;margin-bottom:10px;border-radius:12px;

 text-align:center;font-weight:900;background:#253126

}

#map{height:54vh;min-height:410px;border-radius:20px}

#gps,#debug{font-size:14px;color:#ddd}

.player-icon{

 background:#1677ff;border:4px solid white;border-radius:50%;

 width:24px!important;height:24px!important;box-shadow:0 0 12px #000

}

.zombie-icon{font-size:32px;line-height:32px;text-align:center}

</style>

</head>

<body>

<main>

<section id="home" class="panel">

<h1>🧟 Zombie Evasion</h1>

<h2>V6 — HYBRID HUNTER</h2>

<p>

The infected can use streets or cut across open ground,

but should avoid mapped buildings and water.

</p>

<button id="start">START RUN</button>

</section>

<section id="game" class="panel">

<div id="timer">30:00</div>

<div id="hud">

<div class="box">

INFECTED

<span class="value">1</span>

</div>

<div class="box">

CLOSEST

<span class="value" id="closest">---</span>

</div>

<div class="box">

NAVIGATION

<span class="value" id="nav">SCANNING</span>

</div>

<div class="box">

DISTANCE

<span class="value" id="distance">0.00 km</span>

</div>

</div>

<div id="warning">🟢 Acquiring position…</div>

<div id="map"></div>

<p id="gps">Waiting for GPS…</p>

<p id="debug">Terrain data not loaded.</p>

<button id="recenter">📍 RECENTRE</button>

<button id="end">END RUN</button>

</section>

</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map,playerMarker,zombieMarker,routeLine;

let player=null,zombie=null;

let route=[],routeIndex=0;

let obstacles=[];

let watchID,timerID,moveTimer,rerouteTimer;

let routeBusy=false,gameOver=false;

let seconds=1800;

let totalDistance=0;

let lastGoodPlayer=null;

/* START */

document.getElementById("start").onclick=()=>{

 document.getElementById("home").style.display="none";

 document.getElementById("game").style.display="block";

 map=L.map("map").setView([51.5,-0.1],16);

 L.tileLayer(

 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

 {

  maxZoom:19,

  attribution:"&copy; OpenStreetMap contributors"

 }).addTo(map);

 setTimeout(()=>map.invalidateSize(),300);

 timerID=setInterval(tick,1000);

 watchID=navigator.geolocation.watchPosition(

  gpsSuccess,

  e=>{

   document.getElementById("gps").textContent=

   "GPS error: "+e.message;

  },

  {

   enableHighAccuracy:true,

   maximumAge:1000,

   timeout:15000

  }

 );

};

/* GPS */

function gpsSuccess(p){

 player={

  lat:p.coords.latitude,

  lng:p.coords.longitude

 };

 let accuracy=p.coords.accuracy;

 document.getElementById("gps").textContent=

 "GPS working — accuracy ±"+

 Math.round(accuracy)+"m";

 if(accuracy<=25){

  if(lastGoodPlayer){

   let d=distanceMeters(

    lastGoodPlayer.lat,lastGoodPlayer.lng,

    player.lat,player.lng

   );

   if(d>=5 && d<=80){

    totalDistance+=d;

    lastGoodPlayer={...player};

   }

  }else{

   lastGoodPlayer={...player};

  }

 }

 document.getElementById("distance").textContent=

 (totalDistance/1000).toFixed(2)+" km";

 if(!playerMarker){

  playerMarker=L.marker(

   [player.lat,player.lng],

   {

    icon:L.divIcon({

     className:"player-icon",

     iconSize:[24,24]

    }),

    zIndexOffset:1000

   }

  ).addTo(map);

  map.setView([player.lat,player.lng],17);

  initialiseHunter();

 }else{

  playerMarker.setLatLng([

   player.lat,player.lng

  ]);

 }

 updateThreat();

}

/* INITIALISE */

async function initialiseHunter(){

 document.getElementById("debug").textContent=

 "Scanning nearby terrain…";

 await loadObstacles();

 spawnZombie();

 await chooseRoute();

 moveTimer=setInterval(moveZombie,500);

 rerouteTimer=setInterval(

  chooseRoute,

  20000

 );

}

/* LOAD OSM OBSTACLES */

async function loadObstacles(){

 /*

 About 700m around player.

 Query mapped buildings and water.

 */

 let q=`

 [out:json][timeout:20];

 (

   way(around:700,${player.lat},${player.lng})["building"];

   way(around:700,${player.lat},${player.lng})["natural"="water"];

   way(around:700,${player.lat},${player.lng})["waterway"="riverbank"];

 );

 out geom;

 `;

 try{

  let response=await fetch(

   "https://overpass-api.de/api/interpreter",

   {

    method:"POST",

    body:"data="+encodeURIComponent(q)

   }

  );

  if(!response.ok) throw new Error();

  let data=await response.json();

  obstacles=[];

  data.elements.forEach(el=>{

   if(!el.geometry || el.geometry.length<3) return;

   obstacles.push(

    el.geometry.map(p=>({

     lat:p.lat,

     lng:p.lon

    }))

   );

  });

  document.getElementById("debug").textContent=

  "Terrain loaded — "+

  obstacles.length+

  " mapped obstacles.";

 }catch(e){

  document.getElementById("debug").textContent=

  "Terrain scan failed — using streets.";

  obstacles=[];

 }

}

/* SPAWN */

function spawnZombie(){

 let spawn=pointFromDistance(

  player.lat,

  player.lng,

  300+Math.random()*100,

  Math.random()*360

 );

 zombie={

  lat:spawn.lat,

  lng:spawn.lng

 };

 zombieMarker=L.marker(

  [zombie.lat,zombie.lng],

  {

   icon:L.divIcon({

    html:"🧟",

    className:"zombie-icon",

    iconSize:[36,36],

    iconAnchor:[18,18]

   })

  }

 ).addTo(map);

}

/* HYBRID AI */

async function chooseRoute(){

 if(routeBusy || !player || !zombie || gameOver) return;

 routeBusy=true;

 /*

 First ask:

 can zombie travel directly without crossing

 a mapped solid obstacle?

 */

 let directClear=

  !lineHitsObstacle(

   zombie,

   player

  );

 if(directClear){

  route=[

   [zombie.lat,zombie.lng],

   [player.lat,player.lng]

  ];

  routeIndex=1;

  drawRoute(route,"field");

  document.getElementById("nav").textContent=

  "FIELD";

  document.getElementById("debug").textContent=

  "Open route detected — hunter cutting across terrain.";

  routeBusy=false;

  return;

 }

 /*

 Direct path blocked.

 Ask Valhalla for pedestrian route.

 */

 document.getElementById("nav").textContent=

 "STREET";

 document.getElementById("debug").textContent=

 "Obstacle detected — finding route around it.";

 try{

  let request={

   locations:[

    {lat:zombie.lat,lon:zombie.lng,type:"break"},

    {lat:player.lat,lon:player.lng,type:"break"}

   ],

   costing:"pedestrian"

  };

  let url=

  "https://valhalla1.openstreetmap.de/route?json="+

  encodeURIComponent(JSON.stringify(request));

  let response=await fetch(url,{

   headers:{

    "X-Client-Id":"zombie-evasion.github.io"

   }

  });

  if(!response.ok) throw new Error();

  let data=await response.json();

  route=decodePolyline6(

   data.trip.legs[0].shape

  );

  routeIndex=0;

  drawRoute(route,"street");

 }catch(e){

  document.getElementById("nav").textContent=

  "WAIT";

  document.getElementById("debug").textContent=

  "Routing unavailable — hunter waiting.";

 }

 routeBusy=false;

}

/* COLLISION TEST */

function lineHitsObstacle(a,b){

 for(let polygon of obstacles){

  for(let i=0;i<polygon.length-1;i++){

   if(

    segmentsIntersect(

     a,

     b,

     polygon[i],

     polygon[i+1]

    )

   ){

    return true;

   }

  }

 }

 return false;

}

function segmentsIntersect(a,b,c,d){

 function orient(p,q,r){

  return(

   (q.lng-p.lng)*(r.lat-p.lat)-

   (q.lat-p.lat)*(r.lng-p.lng)

  );

 }

 let o1=orient(a,b,c);

 let o2=orient(a,b,d);

 let o3=orient(c,d,a);

 let o4=orient(c,d,b);

 return(

  ((o1>0 && o2<0)||(o1<0 && o2>0)) &&

  ((o3>0 && o4<0)||(o3<0 && o4>0))

 );

}

/* ROUTE DISPLAY */

function drawRoute(points,type){

 if(routeLine){

  map.removeLayer(routeLine);

 }

 routeLine=L.polyline(

  points,

  type==="field"

   ? {

      weight:5,

      opacity:.8,

      dashArray:"3,9",

      color:"#ff9f0a"

     }

   : {

      weight:4,

      opacity:.7,

      dashArray:"7,8",

      color:"#3b82f6"

     }

 ).addTo(map);

}

/* MOVEMENT */

function moveZombie(){

 if(

  gameOver ||

  !zombie ||

  route.length<2 ||

  routeIndex>=route.length

 ) return;

 /*

 1.25 m/s, update every 0.5 seconds.

 */

 let remaining=.625;

 while(

  remaining>0 &&

  routeIndex<route.length

 ){

  let target=route[routeIndex];

  let d=distanceMeters(

   zombie.lat,zombie.lng,

   target[0],target[1]

  );

  if(d<=remaining){

   zombie.lat=target[0];

   zombie.lng=target[1];

   remaining-=d;

   routeIndex++;

  }else{

   let bearing=bearingBetween(

    zombie.lat,zombie.lng,

    target[0],target[1]

   );

   let next=pointFromDistance(

    zombie.lat,zombie.lng,

    remaining,

    bearing

   );

   zombie.lat=next.lat;

   zombie.lng=next.lng;

   remaining=0;

  }

 }

 zombieMarker.setLatLng([

  zombie.lat,zombie.lng

 ]);

 updateThreat();

}

/* THREAT */

function updateThreat(){

 if(!player || !zombie) return;

 let d=distanceMeters(

  player.lat,player.lng,

  zombie.lat,zombie.lng

 );

 document.getElementById("closest").textContent=

 Math.round(d)+" m";

 let w=document.getElementById("warning");

 if(d>150)

  w.textContent="🟢 No immediate threat";

 else if(d>75)

  w.textContent="🟡 INFECTED NEARBY";

 else if(d>25)

  w.textContent="🔴 RUN — INFECTED CLOSING";

 else{

  gameOver=true;

  stopGame();

  alert("💀 CAUGHT");

 }

}

/* TIMER */

function tick(){

 seconds--;

 let m=Math.floor(seconds/60);

 let s=seconds%60;

 document.getElementById("timer").textContent=

 String(m).padStart(2,"0")+":"+

 String(s).padStart(2,"0");

 if(seconds<=0){

  gameOver=true;

  stopGame();

  alert("YOU SURVIVED!");

 }

}

/* POLYLINE */

function decodePolyline6(encoded){

 let coordinates=[];

 let index=0,lat=0,lng=0;

 while(index<encoded.length){

  let result=0,shift=0,byte;

  do{

   byte=encoded.charCodeAt(index++)-63;

   result|=(byte&31)<<shift;

   shift+=5;

  }while(byte>=32);

  lat+=(result&1)?~(result>>1):(result>>1);

  result=0;

  shift=0;

  do{

   byte=encoded.charCodeAt(index++)-63;

   result|=(byte&31)<<shift;

   shift+=5;

  }while(byte>=32);

  lng+=(result&1)?~(result>>1):(result>>1);

  coordinates.push([

   lat/1e6,

   lng/1e6

  ]);

 }

 return coordinates;

}

/* GEO */

function distanceMeters(a,b,c,d){

 const R=6371000;

 const p1=a*Math.PI/180;

 const p2=c*Math.PI/180;

 const dp=(c-a)*Math.PI/180;

 const dl=(d-b)*Math.PI/180;

 const x=

 Math.sin(dp/2)**2+

 Math.cos(p1)*Math.cos(p2)*

 Math.sin(dl/2)**2;

 return R*2*Math.atan2(

  Math.sqrt(x),

  Math.sqrt(1-x)

 );

}

function bearingBetween(a,b,c,d){

 const p1=a*Math.PI/180;

 const p2=c*Math.PI/180;

 const dl=(d-b)*Math.PI/180;

 const y=Math.sin(dl)*Math.cos(p2);

 const x=

 Math.cos(p1)*Math.sin(p2)-

 Math.sin(p1)*Math.cos(p2)*Math.cos(dl);

 return(

  Math.atan2(y,x)*180/Math.PI+360

 )%360;

}

function pointFromDistance(lat,lng,m,bearing){

 const R=6371000;

 const d=m/R;

 const br=bearing*Math.PI/180;

 const p1=lat*Math.PI/180;

 const l1=lng*Math.PI/180;

 const p2=Math.asin(

  Math.sin(p1)*Math.cos(d)+

  Math.cos(p1)*Math.sin(d)*Math.cos(br)

 );

 const l2=l1+Math.atan2(

  Math.sin(br)*Math.sin(d)*Math.cos(p1),

  Math.cos(d)-Math.sin(p1)*Math.sin(p2)

 );

 return{

  lat:p2*180/Math.PI,

  lng:l2*180/Math.PI

 };

}

/* BUTTONS */

document.getElementById("recenter").onclick=()=>{

 if(player)

  map.setView([player.lat,player.lng],17);

};

document.getElementById("end").onclick=()=>{

 stopGame();

 location.reload();

};

function stopGame(){

 clearInterval(timerID);

 clearInterval(moveTimer);

 clearInterval(rerouteTimer);

 if(watchID!==undefined)

  navigator.geolocation.clearWatch(watchID);

}

</script>

</body>

</html>
