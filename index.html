<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Zombie Evasion V9</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b0d0e;
 color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

main{
 max-width:600px;
 margin:auto;
 padding:18px;
}

.panel{
 background:#1b1e21;
 border-radius:24px;
 padding:20px;
}

h1{font-size:38px;margin:0 0 12px}
h2{font-size:18px;color:#bbb}

button{
 width:100%;
 padding:18px;
 margin-top:12px;
 border:0;
 border-radius:18px;
 font-size:19px;
 font-weight:800;
 color:#2878ff;
}

#game{display:none}

#timer{
 font-size:42px;
 font-weight:900;
 margin-bottom:10px;
}

#hud{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-bottom:10px;
}

.box{
 background:#292d31;
 padding:10px;
 border-radius:12px;
 font-size:13px;
}

.value{
 display:block;
 font-size:19px;
 font-weight:900;
 margin-top:3px;
}

#warning{
 padding:11px;
 margin-bottom:10px;
 border-radius:12px;
 text-align:center;
 font-weight:900;
 background:#253126;
}

#map{
 height:54vh;
 min-height:410px;
 border-radius:20px;
}

#gps,#terrainStatus,#debug{
 font-size:14px;
 color:#ddd;
}

.player-icon{
 background:#1677ff;
 border:4px solid white;
 border-radius:50%;
 width:24px!important;
 height:24px!important;
 box-shadow:0 0 12px #000;
}

.zombie-icon{
 font-size:31px;
 line-height:31px;
 text-align:center;
}
</style>
</head>

<body>

<main>

<section id="home" class="panel">

<h1>🧟 Zombie Evasion</h1>

<h2>V9 — MULTI-PREDATOR</h2>

<p>
Three infected hunt independently using roads,
paths and recognised open terrain.
</p>

<button id="start">START RUN</button>

</section>


<section id="game" class="panel">

<div id="timer">30:00</div>

<div id="hud">

<div class="box">
INFECTED
<span class="value" id="infected">0 / 3</span>
</div>

<div class="box">
CLOSEST
<span class="value" id="closest">---</span>
</div>

<div class="box">
THREAT MODE
<span class="value" id="nav">GPS</span>
</div>

<div class="box">
DISTANCE
<span class="value" id="distance">0.00 km</span>
</div>

</div>

<div id="warning">🟢 Acquiring position…</div>

<div id="map"></div>

<p id="gps">Waiting for GPS…</p>

<p id="terrainStatus">
Terrain intelligence waiting…
</p>

<p id="debug">
Predators dormant.
</p>

<button id="recenter">📍 RECENTRE</button>

<button id="end">END RUN</button>

</section>

</main>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==================================================
   CORE
================================================== */

let map;
let playerMarker;
let closestRouteLine;

let player=null;

let zombies=[];

const MAX_ZOMBIES=3;

let hardObstacles=[];
let openAreas=[];

let terrainReady=false;

let watchID;
let timerID;
let moveTimer;
let plannerTimer;

let seconds=1800;

let totalDistance=0;
let lastGoodPlayer=null;

let gameOver=false;
let gameInitialised=false;

/*
Only ONE network request at a time.
*/
let routingBusy=false;


/* ==================================================
   START
================================================== */

document.getElementById("start").onclick=function(){

 document.getElementById("home").style.display="none";
 document.getElementById("game").style.display="block";

 updateTimer();

 timerID=setInterval(
  tick,
  1000
 );

 map=L.map(
  "map",
  {zoomControl:true}
 ).setView(
  [51.5,-0.1],
  16
 );

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:19,
   attribution:"&copy; OpenStreetMap contributors"
  }
 ).addTo(map);

 setTimeout(function(){
  map.invalidateSize();
 },200);

 if(!navigator.geolocation){

  document.getElementById("gps").textContent=
  "GPS unavailable.";

  return;
 }

 watchID=
 navigator.geolocation.watchPosition(
  gpsSuccess,
  gpsError,
  {
   enableHighAccuracy:true,
   maximumAge:1000,
   timeout:15000
  }
 );

};


/* ==================================================
   GPS
================================================== */

function gpsSuccess(position){

 const lat=position.coords.latitude;
 const lng=position.coords.longitude;
 const accuracy=position.coords.accuracy;

 player={lat,lng};

 document.getElementById("gps").textContent=
 "GPS working — accuracy ±"+
 Math.round(accuracy)+"m";

 /*
 Distance filtering
 */

 if(accuracy<=25){

  if(!lastGoodPlayer){

   lastGoodPlayer={lat,lng};

  }else{

   let moved=
   distanceMeters(
    lastGoodPlayer.lat,
    lastGoodPlayer.lng,
    lat,
    lng
   );

   if(
    moved>=5 &&
    moved<=80
   ){

    totalDistance+=moved;
    lastGoodPlayer={lat,lng};

   }

  }

 }

 document.getElementById("distance").textContent=
 (totalDistance/1000).toFixed(2)+" km";


 /*
 Player marker
 */

 if(!playerMarker){

  playerMarker=
  L.marker(
   [lat,lng],
   {
    icon:L.divIcon({
     className:"player-icon",
     iconSize:[24,24]
    }),
    zIndexOffset:1000
   }
  ).addTo(map);

  map.setView(
   [lat,lng],
   17
  );

  if(!gameInitialised){

   gameInitialised=true;

   setTimeout(
    initialiseGame,
    100
   );

  }

 }else{

  playerMarker.setLatLng(
   [lat,lng]
  );

 }

 updateThreat();

}


function gpsError(error){

 document.getElementById("gps").textContent=
 "GPS error: "+error.message;

}


/* ==================================================
   INITIALISE
================================================== */

async function initialiseGame(){

 document.getElementById("nav").textContent=
 "SPAWNING";

 document.getElementById("debug").textContent=
 "Releasing first infected…";

 /*
 Spawn zombies sequentially.

 This avoids 3 routing requests hitting
 Safari / Valhalla simultaneously.
 */

 await spawnZombie(0);

 setTimeout(
  function(){
   spawnZombie(1);
  },
  4000
 );

 setTimeout(
  function(){
   spawnZombie(2);
  },
  8000
 );

 /*
 Local movement is cheap.
 */

 moveTimer=setInterval(
  moveZombies,
  500
 );

 /*
 Every 2 seconds we consider whether
 ONE zombie needs a new route.
 */

 plannerTimer=setInterval(
  plannerTick,
  2000
 );

 /*
 Terrain loads after the chase starts.
 */

 setTimeout(
  loadTerrain,
  400
 );

}


/* ==================================================
   SPAWN ONE ZOMBIE
================================================== */

async function spawnZombie(index){

 if(
  !player ||
  gameOver
 ){
  return;
 }

 let baseBearings=[
  Math.random()*120,
  120+Math.random()*120,
  240+Math.random()*120
 ];

 let candidate=
 pointFromDistance(
  player.lat,
  player.lng,
  300+
  Math.random()*130,
  baseBearings[index] || Math.random()*360
 );

 document.getElementById("debug").textContent=
 "Finding safe spawn for infected "+
 (index+1)+"…";

 try{

  let walkingRoute=
  await getWalkingRoute(
   candidate,
   player
  );

  if(
   !walkingRoute ||
   walkingRoute.length<2
  ){
   throw new Error("No spawn route");
  }

  let spawnPoint={
   lat:walkingRoute[0][0],
   lng:walkingRoute[0][1]
  };

  let d=
  distanceMeters(
   spawnPoint.lat,
   spawnPoint.lng,
   player.lat,
   player.lng
  );

  /*
  If server snapped it too close,
  try again later.
  */

  if(d<200){

   setTimeout(
    function(){
     spawnZombie(index);
    },
    3000
   );

   return;

  }

  let marker=
  L.marker(
   [
    spawnPoint.lat,
    spawnPoint.lng
   ],
   {
    icon:L.divIcon({
     html:"🧟",
     className:"zombie-icon",
     iconSize:[36,36],
     iconAnchor:[18,18]
    })
   }
  ).addTo(map);


  let routeIndex=
  closestRouteIndex(
   spawnPoint,
   walkingRoute
  );

  if(
   routeIndex<
   walkingRoute.length-1
  ){
   routeIndex++;
  }


  zombies[index]={

   id:index,

   lat:spawnPoint.lat,
   lng:spawnPoint.lng,

   marker:marker,

   route:walkingRoute,
   routeIndex:routeIndex,

   mode:"STREET",

   /*
   Slight individual variation.
   */

   speed:
    1.10+
    Math.random()*0.22,

   /*
   Stagger next routing times.
   */

   nextPlan:
    Date.now()+
    index*3500+
    6000

  };


  updateInfectedCount();

  document.getElementById("debug").textContent=
  "Infected "+(index+1)+" joined the hunt.";

  updateThreat();


 }catch(error){

  /*
  Don't lock the game if spawn routing fails.
  */

  document.getElementById("debug").textContent=
  "Spawn "+(index+1)+" delayed — retrying.";

  setTimeout(
   function(){
    spawnZombie(index);
   },
   4000
  );

 }

}


/* ==================================================
   INFECTED COUNT
================================================== */

function updateInfectedCount(){

 let count=
 zombies.filter(Boolean).length;

 document.getElementById("infected").textContent=
 count+" / "+MAX_ZOMBIES;

}


/* ==================================================
   PLANNER
================================================== */

function plannerTick(){

 if(
  gameOver ||
  routingBusy ||
  !player
 ){
  return;
 }

 let now=Date.now();

 /*
 Pick ONE predator that's due.
 */

 let candidate=null;

 for(
  let zombie of zombies
 ){

  if(
   zombie &&
   now>=zombie.nextPlan
  ){

   candidate=zombie;
   break;

  }

 }

 if(!candidate){
  return;
 }

 /*
 Next check for this predator is
 deliberately staggered.
 */

 candidate.nextPlan=
 now+
 9000+
 candidate.id*1200;

 planZombieRoute(
  candidate
 );

}


/* ==================================================
   PLAN ONE ZOMBIE
================================================== */

async function planZombieRoute(zombie){

 if(
  !zombie ||
  !player ||
  gameOver
 ){
  return;
 }

 /*
 FIELD mode is local geometry.
 No web request needed.
 */

 if(
  terrainReady &&
  directOpenPursuit(
   zombie,
   player
  )
 ){

  zombie.route=[
   [
    zombie.lat,
    zombie.lng
   ],
   [
    player.lat,
    player.lng
   ]
  ];

  zombie.routeIndex=1;
  zombie.mode="FIELD";

  updateThreat();

  return;

 }


 /*
 Otherwise ask for a street/path route.
 Only one request globally at a time.
 */

 routingBusy=true;

 try{

  let newRoute=
  await getWalkingRoute(
   zombie,
   player
  );

  if(
   newRoute &&
   newRoute.length>=2
  ){

   zombie.route=
   newRoute;

   zombie.routeIndex=
   closestRouteIndex(
    zombie,
    newRoute
   );

   if(
    zombie.routeIndex<
    newRoute.length-1
   ){
    zombie.routeIndex++;
   }

   zombie.mode="STREET";

  }

 }catch(error){

  /*
  Keep the old route.
  */

 }finally{

  routingBusy=false;

 }

 updateThreat();

}


/* ==================================================
   MOVE ALL ZOMBIES
================================================== */

function moveZombies(){

 if(gameOver){
  return;
 }

 for(
  let zombie of zombies
 ){

  if(!zombie){
   continue;
  }

  moveOneZombie(
   zombie
  );

 }

 updateThreat();

}


/* ==================================================
   MOVE ONE ZOMBIE
================================================== */

function moveOneZombie(zombie){

 if(
  !zombie.route ||
  zombie.route.length<2 ||
  zombie.routeIndex>=zombie.route.length
 ){
  return;
 }

 /*
 Half-second movement.
 */

 let remaining=
 zombie.speed*
 0.5;


 while(
  remaining>0 &&
  zombie.routeIndex<
  zombie.route.length
 ){

  let target=
  zombie.route[
   zombie.routeIndex
  ];

  let d=
  distanceMeters(
   zombie.lat,
   zombie.lng,
   target[0],
   target[1]
  );

  if(
   d<=remaining
  ){

   zombie.lat=
   target[0];

   zombie.lng=
   target[1];

   remaining-=d;

   zombie.routeIndex++;

  }else{

   let bearing=
   bearingBetween(
    zombie.lat,
    zombie.lng,
    target[0],
    target[1]
   );

   let next=
   pointFromDistance(
    zombie.lat,
    zombie.lng,
    remaining,
    bearing
   );

   zombie.lat=
   next.lat;

   zombie.lng=
   next.lng;

   remaining=0;

  }

 }

 zombie.marker.setLatLng(
  [
   zombie.lat,
   zombie.lng
  ]
 );

}


/* ==================================================
   THREAT SYSTEM
================================================== */

function getClosestZombie(){

 if(
  !player ||
  zombies.length===0
 ){
  return null;
 }

 let best=null;
 let bestDistance=Infinity;

 for(
  let zombie of zombies
 ){

  if(!zombie){
   continue;
  }

  let d=
  distanceMeters(
   player.lat,
   player.lng,
   zombie.lat,
   zombie.lng
  );

  if(
   d<
   bestDistance
  ){

   bestDistance=d;
   best=zombie;

  }

 }

 if(!best){
  return null;
 }

 return{
  zombie:best,
  distance:bestDistance
 };

}


/* ==================================================
   UPDATE THREAT
================================================== */

function updateThreat(){

 let threat=
 getClosestZombie();

 if(!threat){
  return;
 }

 let closest=
 threat.distance;

 let closestZombie=
 threat.zombie;

 document.getElementById("closest").textContent=
 Math.round(closest)+" m";


 /*
 HUD shows mode of nearest zombie.
 */

 document.getElementById("nav").textContent=
 closestZombie.mode;


 /*
 Only show the route belonging to
 the nearest threat.
 */

 showClosestRoute(
  closestZombie
 );


 let warning=
 document.getElementById("warning");


 if(closest>150){

  warning.textContent=
  "🟢 No immediate threat";

 }else if(closest>75){

  warning.textContent=
  "🟡 INFECTED NEARBY";

 }else if(closest>25){

  warning.textContent=
  "🔴 RUN — INFECTED CLOSING";

 }else{

  gameOver=true;

  stopGame();

  alert(
   "💀 CAUGHT"
  );

 }

}


/* ==================================================
   CLOSEST ROUTE DISPLAY
================================================== */

function showClosestRoute(zombie){

 if(!map){
  return;
 }

 if(closestRouteLine){

  map.removeLayer(
   closestRouteLine
  );

  closestRouteLine=null;

 }

 if(
  !zombie ||
  !zombie.route ||
  zombie.route.length<2
 ){
  return;
 }

 let colour=
 zombie.mode==="FIELD"
 ? "#ff9f0a"
 : "#3b82f6";


 closestRouteLine=
 L.polyline(
  zombie.route,
  {
   color:colour,
   weight:5,
   opacity:.75,
   dashArray:"7,8"
  }
 ).addTo(map);

}


/* ==================================================
   TERRAIN CACHE / LOAD
================================================== */

function terrainCacheKey(){

 return(
  "zombieTerrain_v9_"+
  player.lat.toFixed(3)+"_"+
  player.lng.toFixed(3)
 );

}


async function loadTerrain(){

 if(!player){
  return;
 }

 document.getElementById("terrainStatus").textContent=
 "Checking terrain cache…";


 /*
 CACHE
 */

 try{

  let raw=
  localStorage.getItem(
   terrainCacheKey()
  );

  if(raw){

   let cached=
   JSON.parse(raw);

   if(
    cached.time &&
    Date.now()-cached.time<
    6*60*60*1000 &&
    Array.isArray(cached.elements)
   ){

    await processTerrainChunks(
     cached.elements
    );

    terrainReady=true;

    showTerrainReady(
     "cached"
    );

    return;

   }

  }

 }catch(error){}


 /*
 Small neighbourhood query.
 */

 let query=`
 [out:json][timeout:10];
 (
  way(around:420,${player.lat},${player.lng})["building"];
  way(around:420,${player.lat},${player.lng})["natural"="water"];
  way(around:420,${player.lat},${player.lng})["waterway"="riverbank"];
  way(around:420,${player.lat},${player.lng})["barrier"="wall"];
  way(around:420,${player.lat},${player.lng})["barrier"="fence"];
  way(around:420,${player.lat},${player.lng})["landuse"="meadow"];
  way(around:420,${player.lat},${player.lng})["landuse"="grass"];
  way(around:420,${player.lat},${player.lng})["landuse"="recreation_ground"];
  way(around:420,${player.lat},${player.lng})["landuse"="farmland"];
  way(around:420,${player.lat},${player.lng})["landuse"="village_green"];
  way(around:420,${player.lat},${player.lng})["leisure"="park"];
 );
 out geom;
 `;


 let servers=[
  "https://overpass-api.de/api/interpreter",
  "https://overpass.kumi.systems/api/interpreter"
 ];


 for(
  let server of servers
 ){

  try{

   document.getElementById("terrainStatus").textContent=
   "Loading terrain…";

   let elements=
   await fetchTerrain(
    server,
    query
   );


   try{

    localStorage.setItem(
     terrainCacheKey(),
     JSON.stringify({
      time:Date.now(),
      elements:elements
     })
    );

   }catch(error){}


   await processTerrainChunks(
    elements
   );

   terrainReady=true;

   showTerrainReady(
    "live"
   );

   return;

  }catch(error){}

 }


 terrainReady=false;

 document.getElementById("terrainStatus").textContent=
 "Terrain unavailable — street pursuit remains active.";

}


/* ==================================================
   TERRAIN FETCH
================================================== */

async function fetchTerrain(
 server,
 query
){

 const controller=
 new AbortController();

 const timeout=
 setTimeout(
  function(){
   controller.abort();
  },
  5000
 );

 try{

  let response=
  await fetch(
   server,
   {
    method:"POST",
    body:
     "data="+
     encodeURIComponent(query),
    signal:
     controller.signal
   }
  );

  clearTimeout(timeout);

  if(!response.ok){
   throw new Error();
  }

  let data=
  await response.json();

  return(
   data.elements || []
  );

 }catch(error){

  clearTimeout(timeout);

  throw error;

 }

}


/* ==================================================
   TERRAIN PROCESSING
================================================== */

function processTerrainChunks(elements){

 hardObstacles=[];
 openAreas=[];

 return new Promise(
  function(resolve){

   let index=0;

   function nextChunk(){

    let end=
    Math.min(
     index+25,
     elements.length
    );

    for(
     ;
     index<end;
     index++
    ){

     let el=
     elements[index];

     if(
      !el.geometry ||
      el.geometry.length<2
     ){
      continue;
     }

     let tags=
     el.tags || {};

     let points=
     el.geometry.map(
      function(p){
       return{
        lat:p.lat,
        lng:p.lon
       };
      }
     );

     let bbox=
     makeBBox(
      points
     );


     /*
     Hard obstacles
     */

     if(
      tags.building ||
      tags.natural==="water" ||
      tags.waterway==="riverbank" ||
      tags.barrier==="wall" ||
      tags.barrier==="fence"
     ){

      hardObstacles.push({
       points:points,
       bbox:bbox,
       closed:
        !!(
         tags.building ||
         tags.natural==="water" ||
         tags.waterway==="riverbank"
        )
      });

      continue;

     }


     /*
     Recognised open terrain
     */

     if(
      tags.landuse==="meadow" ||
      tags.landuse==="grass" ||
      tags.landuse==="recreation_ground" ||
      tags.landuse==="farmland" ||
      tags.landuse==="village_green" ||
      tags.leisure==="park"
     ){

      if(
       points.length>=3
      ){

       openAreas.push({
        points:points,
        bbox:bbox
       });

      }

     }

    }


    if(
     index<
     elements.length
    ){

     setTimeout(
      nextChunk,
      0
     );

    }else{

     resolve();

    }

   }

   nextChunk();

  }
 );

}


function showTerrainReady(source){

 document.getElementById("terrainStatus").textContent=

 "Terrain ready — "+
 hardObstacles.length+
 " obstacles / "+
 openAreas.length+
 " open zones ("+
 source+
 ").";

}


/* ==================================================
   FIELD DECISION
================================================== */

function directOpenPursuit(a,b){

 if(
  lineHitsHardObstacle(
   a,
   b
  )
 ){
  return false;
 }

 let d=
 distanceMeters(
  a.lat,
  a.lng,
  b.lat,
  b.lng
 );

 let samples=
 Math.min(
  10,
  Math.max(
   4,
   Math.ceil(d/40)
  )
 );

 let open=0;

 for(
  let i=0;
  i<=samples;
  i++
 ){

  let t=
  i/samples;

  let point={

   lat:
    a.lat+
    (b.lat-a.lat)*t,

   lng:
    a.lng+
    (b.lng-a.lng)*t

  };

  if(
   pointInOpenArea(
    point
   )
  ){
   open++;
  }

 }

 return(
  open/
  (samples+1)
 )>=0.65;

}


/* ==================================================
   WALKING ROUTER
================================================== */

async function getWalkingRoute(
 start,
 end
){

 let request={

  locations:[

   {
    lat:start.lat,
    lon:start.lng,
    type:"break"
   },

   {
    lat:end.lat,
    lon:end.lng,
    type:"break"
   }

  ],

  costing:"pedestrian"

 };

 let url=

 "https://valhalla1.openstreetmap.de/route?json="+

 encodeURIComponent(
  JSON.stringify(request)
 );

 const controller=
 new AbortController();

 const timeout=
 setTimeout(
  function(){
   controller.abort();
  },
  6000
 );

 try{

  let response=
  await fetch(
   url,
   {
    signal:
     controller.signal
   }
  );

  clearTimeout(timeout);

  if(!response.ok){
   throw new Error();
  }

  let data=
  await response.json();

  if(
   !data.trip ||
   !data.trip.legs ||
   !data.trip.legs[0] ||
   !data.trip.legs[0].shape
  ){
   throw new Error();
  }

  return decodePolyline6(
   data.trip.legs[0].shape
  );

 }catch(error){

  clearTimeout(timeout);

  throw error;

 }

}


/* ==================================================
   TERRAIN COLLISION
================================================== */

function lineHitsHardObstacle(
 a,
 b
){

 let lineBox=
 makeBBox(
  [a,b]
 );

 for(
  let obstacle of hardObstacles
 ){

  if(
   !boxesOverlap(
    lineBox,
    obstacle.bbox
   )
  ){
   continue;
  }

  let points=
  obstacle.points;

  for(
   let i=0;
   i<points.length-1;
   i++
  ){

   if(
    segmentsIntersect(
     a,
     b,
     points[i],
     points[i+1]
    )
   ){
    return true;
   }

  }

  if(
   obstacle.closed &&
   points.length>2
  ){

   if(
    segmentsIntersect(
     a,
     b,
     points[
      points.length-1
     ],
     points[0]
    )
   ){
    return true;
   }

  }

 }

 return false;

}


/* ==================================================
   OPEN AREA TEST
================================================== */

function pointInOpenArea(point){

 for(
  let area of openAreas
 ){

  if(
   point.lat<
    area.bbox.minLat ||
   point.lat>
    area.bbox.maxLat ||
   point.lng<
    area.bbox.minLng ||
   point.lng>
    area.bbox.maxLng
  ){
   continue;
  }

  if(
   pointInPolygon(
    point,
    area.points
   )
  ){
   return true;
  }

 }

 return false;

}


/* ==================================================
   BBOX
================================================== */

function makeBBox(points){

 let minLat=Infinity;
 let maxLat=-Infinity;
 let minLng=Infinity;
 let maxLng=-Infinity;

 for(
  let p of points
 ){

  minLat=
  Math.min(
   minLat,
   p.lat
  );

  maxLat=
  Math.max(
   maxLat,
   p.lat
  );

  minLng=
  Math.min(
   minLng,
   p.lng
  );

  maxLng=
  Math.max(
   maxLng,
   p.lng
  );

 }

 return{
  minLat,
  maxLat,
  minLng,
  maxLng
 };

}


function boxesOverlap(a,b){

 return !(
  a.maxLat<b.minLat ||
  a.minLat>b.maxLat ||
  a.maxLng<b.minLng ||
  a.minLng>b.maxLng
 );

}


/* ==================================================
   POLYGON
================================================== */

function pointInPolygon(
 p,
 poly
){

 let inside=false;

 for(
  let i=0,
      j=poly.length-1;

  i<poly.length;

  j=i++
 ){

  let xi=poly[i].lng;
  let yi=poly[i].lat;

  let xj=poly[j].lng;
  let yj=poly[j].lat;

  let intersect=

  ((yi>p.lat)!==(yj>p.lat))

  &&

  (
   p.lng<

   (xj-xi)*
   (p.lat-yi)/
   ((yj-yi)||0.0000001)
   +xi
  );

  if(intersect){
   inside=!inside;
  }

 }

 return inside;

}


/* ==================================================
   SEGMENTS
================================================== */

function segmentsIntersect(
 a,b,c,d
){

 function orientation(
  p,q,r
 ){

  return(
   (q.lng-p.lng)*
   (r.lat-p.lat)
   -
   (q.lat-p.lat)*
   (r.lng-p.lng)
  );

 }

 let o1=
 orientation(a,b,c);

 let o2=
 orientation(a,b,d);

 let o3=
 orientation(c,d,a);

 let o4=
 orientation(c,d,b);

 return(

  (
   (o1>0 && o2<0) ||
   (o1<0 && o2>0)
  )

  &&

  (
   (o3>0 && o4<0) ||
   (o3<0 && o4>0)
  )

 );

}


/* ==================================================
   CLOSEST ROUTE INDEX
================================================== */

function closestRouteIndex(
 point,
 points
){

 let bestIndex=0;
 let bestDistance=Infinity;

 for(
  let i=0;
  i<points.length;
  i++
 ){

  let d=
  distanceMeters(
   point.lat,
   point.lng,
   points[i][0],
   points[i][1]
  );

  if(
   d<
   bestDistance
  ){

   bestDistance=d;
   bestIndex=i;

  }

 }

 return bestIndex;

}


/* ==================================================
   POLYLINE6
================================================== */

function decodePolyline6(encoded){

 let coordinates=[];

 let index=0;
 let lat=0;
 let lng=0;

 while(
  index<
  encoded.length
 ){

  let result=0;
  let shift=0;
  let byte;

  do{

   byte=
   encoded.charCodeAt(
    index++
   )-63;

   result|=
   (byte&31)<<shift;

   shift+=5;

  }while(
   byte>=32
  );

  lat+=
  (result&1)
  ? ~(result>>1)
  : (result>>1);

  result=0;
  shift=0;

  do{

   byte=
   encoded.charCodeAt(
    index++
   )-63;

   result|=
   (byte&31)<<shift;

   shift+=5;

  }while(
   byte>=32
  );

  lng+=
  (result&1)
  ? ~(result>>1)
  : (result>>1);

  coordinates.push(
   [
    lat/1e6,
    lng/1e6
   ]
  );

 }

 return coordinates;

}


/* ==================================================
   GEO MATH
================================================== */

function distanceMeters(
 lat1,
 lon1,
 lat2,
 lon2
){

 const R=6371000;

 const p1=
 lat1*Math.PI/180;

 const p2=
 lat2*Math.PI/180;

 const dp=
 (lat2-lat1)*
 Math.PI/180;

 const dl=
 (lon2-lon1)*
 Math.PI/180;

 const a=

 Math.sin(dp/2)**2

 +

 Math.cos(p1)*
 Math.cos(p2)*
 Math.sin(dl/2)**2;

 return R*2*Math.atan2(
  Math.sqrt(a),
  Math.sqrt(1-a)
 );

}


function bearingBetween(
 lat1,
 lon1,
 lat2,
 lon2
){

 const p1=
 lat1*Math.PI/180;

 const p2=
 lat2*Math.PI/180;

 const dl=
 (lon2-lon1)*
 Math.PI/180;

 const y=
 Math.sin(dl)*
 Math.cos(p2);

 const x=

 Math.cos(p1)*
 Math.sin(p2)

 -

 Math.sin(p1)*
 Math.cos(p2)*
 Math.cos(dl);

 return(
  Math.atan2(y,x)*
  180/Math.PI+
  360
 )%360;

}


function pointFromDistance(
 lat,
 lng,
 metres,
 bearing
){

 const R=6371000;

 const d=
 metres/R;

 const b=
 bearing*Math.PI/180;

 const p1=
 lat*Math.PI/180;

 const l1=
 lng*Math.PI/180;

 const p2=
 Math.asin(

  Math.sin(p1)*
  Math.cos(d)

  +

  Math.cos(p1)*
  Math.sin(d)*
  Math.cos(b)

 );

 const l2=
 l1+
 Math.atan2(

  Math.sin(b)*
  Math.sin(d)*
  Math.cos(p1),

  Math.cos(d)
  -
  Math.sin(p1)*
  Math.sin(p2)

 );

 return{

  lat:
  p2*180/Math.PI,

  lng:
  l2*180/Math.PI

 };

}


/* ==================================================
   TIMER
================================================== */

function tick(){

 if(gameOver){
  return;
 }

 seconds--;

 updateTimer();

 if(seconds<=0){

  gameOver=true;

  stopGame();

  alert(
   "YOU SURVIVED!"
  );

 }

}


function updateTimer(){

 let mins=
 Math.floor(
  seconds/60
 );

 let secs=
 seconds%60;

 document.getElementById("timer").textContent=

 String(mins).padStart(
  2,
  "0"
 )

 +

 ":"

 +

 String(secs).padStart(
  2,
  "0"
 );

}
